  },
};

/* ===========================================================
   UNIMAP – exportação, arquivos, backstage, atalhos, inicialização
   =========================================================== */
'use strict';

/* ---------- exportação ---------- */
const Exporter = {
  baseName() { return (Ed.model.fileName || 'Modelo').replace(/\.bpm$/i, ''); },
  fileSafe(s) { return String(s).replace(/[\\/:*?"<>|]+/g, '_').trim() || 'diagrama'; },
  svgText(d, pad = 20) { return Render.svgDocument(d, View.ctxImages(), pad); },
  svgSize(svg) { const m = svg.match(/<svg[^>]* width="(\d+)" height="(\d+)"/); return { w: +m[1], h: +m[2] }; },

  svg() { const d = Ed.d; U.download(this.fileSafe(d.doc.root.a.Name) + '.svg', this.svgText(d), 'image/svg+xml'); },

  rasterize(d, scale = 2, type = 'image/png', q = 0.92) {
    const svg = this.svgText(d); const { w, h } = this.svgSize(svg);
    const max = 12000; scale = Math.min(scale, max / w, max / h);
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }));
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas'); c.width = Math.ceil(w * scale); c.height = Math.ceil(h * scale);
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b => res({ blob: b, w, h, cw: c.width, ch: c.height, canvas: c }), type, q);
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Falha ao renderizar o diagrama.')); };
      img.src = url;
    });
  },
  async png() { const r = await this.rasterize(Ed.d, 2); U.download(this.fileSafe(Ed.d.doc.root.a.Name) + '.png', r.blob, 'image/png'); },

  /* PDF mínimo com uma imagem JPEG por página */
  async pdf(all = false) {
    const list = all ? Ed.model.diagrams : [Ed.d]; const pages = [];
    for (const d of list) {
      const r = await this.rasterize(d, 2.5, 'image/jpeg', 0.92);
      pages.push({ jpg: new Uint8Array(await r.blob.arrayBuffer()), w: r.w, h: r.h, pw: r.cw, ph: r.ch });
    }
    const enc = new TextEncoder(); const parts = []; let len = 0; const offs = [];
    const put = x => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); len += b.length; };
    const obj = (n, body) => { offs[n] = len; put(`${n} 0 obj\n`); put(body); put('\nendobj\n'); };
    put('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    const N = pages.length; const kids = pages.map((_, i) => `${3 + i * 3} 0 R`).join(' ');
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, `<< /Type /Pages /Kids [${kids}] /Count ${N} >>`);
    pages.forEach((p, i) => {
      const pg = 3 + i * 3, ct = pg + 1, im = pg + 2;
      const W = Math.round(p.w * 0.75 * 100) / 100, H = Math.round(p.h * 0.75 * 100) / 100;
      obj(pg, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${ct} 0 R >>`);
      const cs = `q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
      obj(ct, `<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
      offs[im] = len; put(`${im} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.pw} /Height ${p.ph} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpg.length} >>\nstream\n`); put(p.jpg); put('\nendstream\nendobj\n');
    });
    const total = 3 + N * 3; const xref = len;
    let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
    for (let i = 1; i < total; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
    put(x + `trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
    const out = new Uint8Array(len); let o = 0; for (const b of parts) { out.set(b, o); o += b.length; }
    U.download(this.fileSafe(all ? this.baseName() : Ed.d.doc.root.a.Name) + '.pdf', out, 'application/pdf');
  },

  xpdl() { U.download(this.fileSafe(Ed.d.doc.root.a.Name) + '.xpdl', X.write(Ed.d.doc), 'application/xml'); },

  /* ---------- BPMN 2.0 ---------- */
  bpmnXml(d) {
    const esc = U.esc; const id = s => 'id_' + String(s).replace(/[^A-Za-z0-9_.-]/g, '_');
    const idx = Sc.index(d); const root = d.doc.root;
    const lines = []; const w = (n, s) => lines.push('  '.repeat(n) + s);
    const visPools = idx.pools.filter(p => p.n.a.BoundaryVisible !== 'false');
    const procs = Sc.processes(d);
    const laneOf = new Map();            // activityId -> laneId
    for (const a of idx.acts) { const r = Sc.rect(a.n); const l = Sc.laneAt(idx, r.x + r.w / 2, r.y + r.h / 2); if (l && l.lane) laneOf.set(a.id, l.lane.id); }
    const nameOf = o => esc((o.n.a.Name || '').replace(/\s+/g, ' ').trim());
    const trigDef = (t) => ({ Message: 'messageEventDefinition', Timer: 'timerEventDefinition', Error: 'errorEventDefinition', Escalation: 'escalationEventDefinition', Cancel: 'cancelEventDefinition', Compensation: 'compensateEventDefinition', Conditional: 'conditionalEventDefinition', Link: 'linkEventDefinition', Signal: 'signalEventDefinition', Terminate: 'terminateEventDefinition' }[t]);
    const evDef = (a, n) => {
      const t = Sc.trigger(a.n); const def = trigDef(t);
      if (def) { if (t === 'Conditional') w(n, `<bpmn:conditionalEventDefinition><bpmn:condition xsi:type="bpmn:tFormalExpression" /></bpmn:conditionalEventDefinition>`); else if (t === 'Link') w(n, `<bpmn:linkEventDefinition name="link" />`); else w(n, `<bpmn:${def} />`); }
      else if (t === 'Multiple' || t === 'ParallelMultiple') { w(n, '<bpmn:messageEventDefinition />'); w(n, '<bpmn:signalEventDefinition />'); }
    };
    const gwTag = { Exclusive: 'exclusiveGateway', ExclusiveNoMarker: 'exclusiveGateway', Inclusive: 'inclusiveGateway', Parallel: 'parallelGateway', Complex: 'complexGateway', EventBased: 'eventBasedGateway', EventBasedParallel: 'eventBasedGateway' };
    const taskTag = { None: 'task', User: 'userTask', Manual: 'manualTask', Service: 'serviceTask', Script: 'scriptTask', BusinessRule: 'businessRuleTask', Send: 'sendTask', Receive: 'receiveTask', Call: 'callActivity' };
    const hitAt = (pt) => { let best = null, bd = 1e9; for (const o of [...idx.arts, ...idx.acts]) { const r = Sc.rect(o.n); const dx = Math.max(r.x - pt.x, 0, pt.x - (r.x + r.w)), dy = Math.max(r.y - pt.y, 0, pt.y - (r.y + r.h)); const d = Math.hypot(dx, dy); if (d < bd) { bd = d; best = o; } } return bd <= 12 ? best : null; };
    const ends = (f) => { let a = f.n.a.Source || f.n.a.From, b = f.n.a.Target || f.n.a.To; if (!a || !b) { const p = Sc.pts(f.n); if (p.length > 1) { if (!a) { const h = hitAt(p[0]); a = h && h.id; } if (!b) { const h = hitAt(p[p.length - 1]); b = h && h.id; } } } return { a, b }; };
    const okIds = new Set();
    const defaultOf = new Map();
    for (const f of idx.flows) { const c = X.q(f.n, 'Condition'); if (c && c.a.Type === 'OTHERWISE') defaultOf.set(f.n.a.From, f.id); }

    const hasLaneInfo = visPools.length > 0;
    const colName = id('collab_' + root.a.Id);
    w(0, '<?xml version="1.0" encoding="UTF-8"?>');
    w(0, `<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" id="${id('defs_' + root.a.Id)}" targetNamespace="http://unimap.local/bpmn" exporter="UNIMAP" exporterVersion="1.0">`);
    if (hasLaneInfo) {
      w(1, `<bpmn:collaboration id="${colName}">`);
      for (const p of visPools) w(2, `<bpmn:participant id="${id(p.id)}" name="${nameOf(p)}" processRef="${id(p.n.a.Process)}" />`);
      for (const m of idx.msgs) { const e = ends(m); if (e.a && e.b) okIds.add(m.id), w(2, `<bpmn:messageFlow id="${id(m.id)}" name="${esc(m.n.a.Name || '')}" sourceRef="${id(e.a)}" targetRef="${id(e.b)}" />`); }
      w(1, '</bpmn:collaboration>');
    }
    const firstProc = procs[0];
    for (const proc of procs) {
      const pool = idx.pools.find(p => p.n.a.Process === proc.a.Id);
      w(1, `<bpmn:process id="${id(proc.a.Id)}" name="${esc(proc.a.Name || '')}" isExecutable="false">`);
      if (pool && pool.lanes.length) {
        w(2, `<bpmn:laneSet id="${id('ls_' + pool.id)}">`);
        for (const l of pool.lanes) {
          w(3, `<bpmn:lane id="${id(l.id)}" name="${nameOf(l)}">`);
          for (const a of idx.acts) if (laneOf.get(a.id) === l.id && X.q(Sc.processes(d).find(pp => X.qa(X.q(pp, 'Activities'), 'Activity').includes(a.n)) || proc, 'Activities') && a.proc === proc) w(4, `<bpmn:flowNodeRef>${id(a.id)}</bpmn:flowNodeRef>`);
          w(3, '</bpmn:lane>');
        }
        w(2, '</bpmn:laneSet>');
      }
      const acts = idx.acts.filter(a => a.proc === proc);
      for (const a of acts) {
        const nm = esc((a.n.a.Name || '').replace(/\s+/g, ' ').trim());
        const doc = X.text(a.n, 'Documentation') || X.text(a.n, 'Description');
        const docX = doc ? `<bpmn:documentation>${esc(doc)}</bpmn:documentation>` : '';
        const defAttr = defaultOf.has(a.id) ? ` default="${id(defaultOf.get(a.id))}"` : '';
        const inc = idx.flows.filter(f => f.n.a.To === a.id).map(f => `<bpmn:incoming>${id(f.id)}</bpmn:incoming>`);
        const out = idx.flows.filter(f => f.n.a.From === a.id).map(f => `<bpmn:outgoing>${id(f.id)}</bpmn:outgoing>`);
        const body = (n) => { if (docX) w(n, docX); inc.forEach(x => w(n, x)); out.forEach(x => w(n, x)); };
        if (a.kind === 'start') { w(2, `<bpmn:startEvent id="${id(a.id)}" name="${nm}"${Sc.trigger(a.n) === 'ParallelMultiple' ? ' parallelMultiple="true"' : ''}>`); body(3); evDef(a, 3); w(2, '</bpmn:startEvent>'); }
        else if (a.kind === 'end') { w(2, `<bpmn:endEvent id="${id(a.id)}" name="${nm}">`); body(3); evDef(a, 3); w(2, '</bpmn:endEvent>'); }
        else if (a.kind === 'inter') {
          const tgt = X.q(a.n, 'Event/IntermediateEvent').a.Target;
          if (tgt) { w(2, `<bpmn:boundaryEvent id="${id(a.id)}" name="${nm}" attachedToRef="${id(tgt)}" cancelActivity="${X.q(a.n, 'Event/IntermediateEvent').a.Cancelactivity !== 'false'}">`); body(3); evDef(a, 3); w(2, '</bpmn:boundaryEvent>'); }
          else { const thr = Sc.isThrow(a.n) || Sc.trigger(a.n) === 'None'; const tag = thr ? 'intermediateThrowEvent' : 'intermediateCatchEvent'; w(2, `<bpmn:${tag} id="${id(a.id)}" name="${nm}">`); body(3); evDef(a, 3); w(2, `</bpmn:${tag}>`); }
        } else if (a.kind === 'gateway') {
          const gt = Sc.gatewayType(a.n); const tag = gwTag[gt] || 'exclusiveGateway';
          const extra = (gt === 'EventBasedParallel' ? ' instantiate="true" eventGatewayType="Parallel"' : '') + (tag === 'exclusiveGateway' || tag === 'inclusiveGateway' || tag === 'complexGateway' ? defAttr : '');
          w(2, `<bpmn:${tag} id="${id(a.id)}" name="${nm}"${extra}>`); body(3); w(2, `</bpmn:${tag}>`);
        } else if (a.kind === 'subprocess') {
          w(2, `<bpmn:subProcess id="${id(a.id)}" name="${nm}"${defAttr}>`); body(3); w(2, '</bpmn:subProcess>');
        } else {
          const tt = Sc.taskType(a.n); const tag = taskTag[tt] || 'task';
          const lp = X.q(a.n, 'Loop'); const lt = lp && lp.a.LoopType;
          const kids = [];
          const hasKids = docX || inc.length || out.length || (lt && lt !== 'None');
          w(2, `<bpmn:${tag} id="${id(a.id)}" name="${nm}"${defAttr}${hasKids ? '' : ' /'}>`);
          if (hasKids) {
            body(3);
            if (lt === 'Standard') w(3, '<bpmn:standardLoopCharacteristics />');
            else if (lt === 'MultiInstance') w(3, `<bpmn:multiInstanceLoopCharacteristics${lp.a.MI_Ordering === 'Sequential' ? ' isSequential="true"' : ''} />`);
            w(2, `</bpmn:${tag}>`);
          }
        }
      }
      for (const f of idx.flows.filter(f => f.proc === proc)) {
        const c = X.q(f.n, 'Condition'); const nm = esc((f.n.a.Name || '').replace(/\s+/g, ' ').trim());
        const ex = c && c.a.Type === 'CONDITION' ? X.text(c, 'Expression') : '';
        const open = `<bpmn:sequenceFlow id="${id(f.id)}" name="${nm}" sourceRef="${id(f.n.a.From)}" targetRef="${id(f.n.a.To)}"`;
        if (ex) { w(2, open + '>'); w(3, `<bpmn:conditionExpression xsi:type="bpmn:tFormalExpression">${esc(ex)}</bpmn:conditionExpression>`); w(2, '</bpmn:sequenceFlow>'); }
        else w(2, open + ' />');
      }
      if (proc === firstProc) {
        for (const a of idx.arts) {
          const t = a.n.a.ArtifactType || 'Annotation';
          if (t === 'Group') w(2, `<bpmn:group id="${id(a.id)}" />`);
          else if (t === 'DataObject') { w(2, `<bpmn:dataObject id="${id(a.id + '_do')}" name="${esc(a.n.a.Name || '')}" />`); w(2, `<bpmn:dataObjectReference id="${id(a.id)}" name="${esc(a.n.a.Name || '')}" dataObjectRef="${id(a.id + '_do')}" />`); }
          else if (t === 'DataStore') w(2, `<bpmn:dataStoreReference id="${id(a.id)}" name="${esc(a.n.a.Name || '')}" />`);
          else w(2, `<bpmn:textAnnotation id="${id(a.id)}"><bpmn:text>${esc(a.n.a.TextAnnotation || a.n.a.Name || '')}</bpmn:text></bpmn:textAnnotation>`);
        }
        for (const s of idx.assocs) { const e = ends(s); if (e.a && e.b) okIds.add(s.id), w(2, `<bpmn:association id="${id(s.id)}" sourceRef="${id(e.a)}" targetRef="${id(e.b)}" associationDirection="${{ One: 'One', Both: 'Both' }[s.n.a.AssociationDirection] || 'None'}" />`); }
      }
      w(1, '</bpmn:process>');
    }
    /* DI */
    const bd = (r) => `<dc:Bounds x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" />`;
    w(1, `<bpmndi:BPMNDiagram id="${id('di_' + root.a.Id)}" name="${esc(root.a.Name)}">`);
    w(2, `<bpmndi:BPMNPlane id="${id('plane_' + root.a.Id)}" bpmnElement="${hasLaneInfo ? colName : id(firstProc.a.Id)}">`);
    for (const p of visPools) { const r = Sc.poolRect(p.n); w(3, `<bpmndi:BPMNShape id="${id('sh_' + p.id)}" bpmnElement="${id(p.id)}" isHorizontal="true">`); w(4, bd(r)); w(3, '</bpmndi:BPMNShape>'); }
    for (const p of visPools) for (const lr of Sc.laneRects(p)) w(3, `<bpmndi:BPMNShape id="${id('sh_' + lr.lane.id)}" bpmnElement="${id(lr.lane.id)}" isHorizontal="true">${bd({ x: lr.x, y: lr.y, w: lr.w, h: lr.h })}</bpmndi:BPMNShape>`);
    for (const a of idx.acts) {
      const r = Sc.rect(a.n); const lbl = (a.kind === 'start' || a.kind === 'inter' || a.kind === 'end' || a.kind === 'gateway') && a.n.a.Name;
      const ex = a.kind === 'subprocess' ? ' isExpanded="false"' : a.kind === 'gateway' && Sc.gatewayType(a.n) === 'Exclusive' ? ' isMarkerVisible="true"' : '';
      w(3, `<bpmndi:BPMNShape id="${id('sh_' + a.id)}" bpmnElement="${id(a.id)}"${ex}>`);
      w(4, bd(r));
      if (lbl) w(4, `<bpmndi:BPMNLabel>${bd(Sc.labelBox(a.n))}</bpmndi:BPMNLabel>`);
      w(3, '</bpmndi:BPMNShape>');
    }
    for (const a of idx.arts) { const r = Sc.rect(a.n); w(3, `<bpmndi:BPMNShape id="${id('sh_' + a.id)}" bpmnElement="${id(a.id)}">${bd(r)}</bpmndi:BPMNShape>`); }
    for (const f of [...idx.flows, ...idx.msgs, ...idx.assocs]) {
      const pts = Sc.pts(f.n); if (pts.length < 2) continue; if ((f.kind === 'assoc' || f.kind === 'msg') && !okIds.has(f.id)) continue;
      w(3, `<bpmndi:BPMNEdge id="${id('ed_' + f.id)}" bpmnElement="${id(f.id)}">`);
      for (const p of pts) w(4, `<di:waypoint x="${p.x}" y="${p.y}" />`);
      if (f.kind !== 'assoc' && f.n.a.Name) w(4, `<bpmndi:BPMNLabel>${bd(Sc.flowLabelBox(f.n))}</bpmndi:BPMNLabel>`);
      w(3, '</bpmndi:BPMNEdge>');
    }
    w(2, '</bpmndi:BPMNPlane>'); w(1, '</bpmndi:BPMNDiagram>'); w(0, '</bpmn:definitions>');
    return lines.join('\n');
  },
  async bpmn(all = false) {
    if (!all) { U.download(this.fileSafe(Ed.d.doc.root.a.Name) + '.bpmn', this.bpmnXml(Ed.d), 'application/xml'); return; }
    const files = Ed.model.diagrams.map(d => ({ name: this.fileSafe(d.doc.root.a.Name) + '.bpmn', data: new TextEncoder().encode(this.bpmnXml(d)) }));
    const seen = new Set(); for (const f of files) { let n = f.name, i = 2; while (seen.has(n)) n = f.name.replace(/\.bpmn$/, ` (${i++}).bpmn`); f.name = n; seen.add(n); }
    U.download(this.baseName() + '_BPMN.zip', await Zip.write(files, new Date()), 'application/zip');
  },

  /* ---------- impressão / documentação ---------- */
  printHtml(title, bodyHtml) {
    return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>${U.esc(title)}</title><style>
      @page{size:A4 landscape;margin:12mm} body{font:12px 'Segoe UI',Arial,sans-serif;color:#222;margin:0}
      .pg{page-break-after:always} .pg:last-child{page-break-after:auto} h1{font-size:16px;margin:0 0 8px;color:#b30000} svg{max-width:100%;height:auto}
      table{border-collapse:collapse;width:100%;margin-top:10px} th,td{border:1px solid #ccc;padding:4px 6px;text-align:left;vertical-align:top} th{background:#f2f2f2}
    </style></head><body>${bodyHtml}</body></html>`;
  },
  print() {
    const body = Ed.model.diagrams.filter(d => d === Ed.d).map(d => `<div class="pg"><h1>${U.esc(d.doc.root.a.Name)}</h1>${this.svgText(d).replace(/^<\?xml[^>]*>\s*/, '')}</div>`).join('');
    const fr = document.createElement('iframe'); fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
    document.body.appendChild(fr); fr.contentDocument.open(); fr.contentDocument.write(this.printHtml(Exporter.baseName(), body)); fr.contentDocument.close();
    setTimeout(() => { fr.contentWindow.focus(); fr.contentWindow.print(); setTimeout(() => fr.remove(), 2000); }, 300);
  },
  docHtml() {
    let body = `<div class="pg"><h1>${U.esc(this.baseName())}</h1><p>Documentação gerada pelo UNIMAP em ${new Date().toLocaleString('pt-BR')}.</p></div>`;
    for (const d of Ed.model.diagrams) {
      const idx = Sc.index(d);
      const rows = idx.acts.map(a => [KIND_LABEL[a.kind] || a.kind, (a.n.a.Name || '').replace(/\s+/g, ' ').trim(), X.text(a.n, 'Description'), X.text(a.n, 'Documentation')]).concat(idx.flows.filter(f => f.n.a.Name).map(f => ['Fluxo', f.n.a.Name, X.text(f.n, 'Description'), '']));
      body += `<div class="pg"><h1>${U.esc(d.doc.root.a.Name)}</h1>${this.svgText(d).replace(/^<\?xml[^>]*>\s*/, '')}<table><thead><tr><th>Tipo</th><th>Nome</th><th>Descrição</th><th>Documentação</th></tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${U.esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    }
    U.download(this.baseName() + '_documentacao.html', this.printHtml(this.baseName(), body), 'text/html');
  },
};

/* ---------- arquivos ---------- */
const File = {
  idb() { return new Promise((res, rej) => { const r = indexedDB.open('unimap', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async kvSet(k, v) { try { const db = await this.idb(); await new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); db.close(); } catch (_) {} },
  async kvGet(k) { try { const db = await this.idb(); const v = await new Promise((res, rej) => { const t = db.transaction('kv'); const q = t.objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); db.close(); return v; } catch (_) { return undefined; } },
  async kvDel(k) { try { const db = await this.idb(); await new Promise(res => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; }); db.close(); } catch (_) {} },

  async confirmDiscard() { if (!Ed.dirty) return true; return UI.confirm('Alterações não salvas', 'O modelo tem alterações não salvas. Deseja descartá-las?', 'Descartar'); },
  async newModel() { if (!await this.confirmDiscard()) return; const m = Model.newModel(); UI.openTabs = []; Ed.setModel(m); View.fit(); this.kvDel('autosave'); },
  async open() {
    if (!await this.confirmDiscard()) return;
    if (window.showOpenFilePicker) {
      try {
        const [h] = await showOpenFilePicker({ types: [{ description: 'Modelo de processos (.bpm)', accept: { 'application/octet-stream': ['.bpm'] } }] });
        const f = await h.getFile(); await this.loadBuffer(new Uint8Array(await f.arrayBuffer()), f.name, h); return;
      } catch (e) { if (e && e.name === 'AbortError') return; if (e && e.name !== 'SecurityError' && e.name !== 'TypeError') { UI.alert('Abrir', U.esc(e.message || e)); return; } }
    }
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.bpm,application/octet-stream';
    inp.onchange = async () => { const f = inp.files[0]; if (f) await this.loadBuffer(new Uint8Array(await f.arrayBuffer()), f.name, null); };
    inp.click();
  },
  async loadBuffer(buf, name, handle) {
    try {
      const m = await Model.load(buf, name);
      UI.openTabs = []; Ed.setModel(m, handle); View.fit(); UI.toast('Aberto: ' + name);
      this.kvDel('autosave');
    } catch (e) { console.error(e); UI.alert('Não foi possível abrir', `O arquivo “${U.esc(name)}” não pôde ser lido como modelo .bpm.<br><small>${U.esc(e.message || e)}</small>`); }
  },
  async save(as = false) {
    const m = Ed.model; if (!m) return;
    Ed.closeEditorIfAny && Ed.closeEditorIfAny();
    let bytes;
    try { bytes = await Model.save(m); } catch (e) { console.error(e); UI.alert('Erro ao salvar', U.esc(e.message || e)); return; }
    const done = (name) => { if (name) m.fileName = name; Ed.dirty = false; m.dirty = false; for (const d of m.diagrams) d.dirty = false; UI.refresh(); Panels.explorer(); UI.toast('Salvo: ' + m.fileName); this.kvDel('autosave'); };
    if (window.showSaveFilePicker) {
      try {
        let h = Ed.fileHandle;
        if (as || !h) { h = await showSaveFilePicker({ suggestedName: m.fileName, types: [{ description: 'Modelo de processos (.bpm)', accept: { 'application/octet-stream': ['.bpm'] } }] }); Ed.fileHandle = h; }
        const wr = await h.createWritable(); await wr.write(bytes); await wr.close(); done(h.name); return;
      } catch (e) { if (e && e.name === 'AbortError') return; if (e && e.name !== 'SecurityError' && e.name !== 'TypeError' && e.name !== 'NotAllowedError') { UI.alert('Erro ao salvar', U.esc(e.message || e)); return; } }
    }
    if (as || !/\.bpm$/i.test(m.fileName) || true) {
      if (as) { const n = await UI.prompt('Salvar como', 'Nome do arquivo', m.fileName.replace(/\.bpm$/i, '')); if (n === null || !n.trim()) return; m.fileName = Exporter.fileSafe(n) + '.bpm'; }
    }
    U.download(m.fileName, bytes, 'application/octet-stream'); done();
  },

  /* autosave local (IndexedDB) */
  _t: 0,
  scheduleAutosave() { clearTimeout(this._t); this._t = setTimeout(async () => { if (!Ed.model || !Ed.dirty) return; try { const b = await Model.save(Ed.model, { touch: false }); await this.kvSet('autosave', { name: Ed.model.fileName, at: Date.now(), data: b }); } catch (_) {} }, 4000); },
  async tryRestore() {
    const r = await this.kvGet('autosave'); if (!r || !r.data) return false;
    const ok = await UI.confirm('Restaurar sessão', `Foi encontrada uma cópia automática não salva de “${U.esc(r.name)}” (${new Date(r.at).toLocaleString('pt-BR')}). Deseja restaurá-la?`, 'Restaurar');
    if (!ok) { this.kvDel('autosave'); return false; }
    await this.loadBuffer(r.data, r.name, null); Ed.dirty = true; UI.refresh(); return true;
  },
};

/* ---------- menu Arquivo (backstage) ---------- */
const Backstage = {
  open() {
    UI.closeMenus();
    const items = [
      ['new', 'Novo modelo'], ['open', 'Abrir…'], ['save', 'Salvar'], ['saveas', 'Salvar como…'], null,
      ['exportPng', 'Exportar PNG'], ['exportSvg', 'Exportar SVG'], ['exportPdf', 'Exportar PDF'], ['exportBpmn', 'Exportar BPMN 2.0'], ['exportXpdl', 'Exportar XPDL'], ['docHtml', 'Documentação HTML'], ['print', 'Imprimir'], null,
      ['shortcuts', 'Atalhos de teclado'], ['about', 'Sobre o UNIMAP'],
    ];
    const bk = h(`<div class="backstage"><div class="bs-menu"><button class="bs-back" aria-label="Voltar">${ico('chevron', 20)}<span>Voltar</span></button>${items.map(i => i ? `<button class="bs-i" data-cmd="${i[0]}">${ico(CMD[i[0]].icon, 20)}<span>${i[1]}</span></button>` : '<hr>').join('')}</div><div class="bs-main"><img class="bs-logo" src="${LOGO_FULL}" alt="UNIMAP"><h2>UNIMAP</h2><p>Mapeamento de processos BPMN</p><div class="bs-info"><b>${U.esc(Ed.model.fileName)}</b><br>${Ed.model.diagrams.length} diagrama(s) · ${Ed.dirty ? 'com alterações não salvas' : 'sem alterações pendentes'}</div></div></div>`);
    const close = () => { bk.remove(); document.removeEventListener('keydown', esc, true); };
    const esc = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
    document.addEventListener('keydown', esc, true);
    bk.addEventListener('click', e => { if (e.target.closest('.bs-back') || e.target === bk) { close(); return; } const b = e.target.closest('[data-cmd]'); if (b) { close(); setTimeout(() => UI.run(b.dataset.cmd), 0); } });
    $('#modalRoot').appendChild(bk);
  },
};

const SHORTCUTS = [
  ['Arquivo', [['Ctrl+N', 'Novo modelo'], ['Ctrl+O', 'Abrir .bpm'], ['Ctrl+S', 'Salvar'], ['Ctrl+Shift+S', 'Salvar como'], ['Ctrl+P', 'Imprimir']]],
  ['Edição', [['Ctrl+Z / Ctrl+Y', 'Desfazer / Refazer'], ['Ctrl+C / X / V', 'Copiar / Recortar / Colar'], ['Ctrl+D', 'Duplicar'], ['Ctrl+A', 'Selecionar tudo'], ['Del', 'Excluir'], ['F2 / Enter', 'Editar texto'], ['Setas', 'Mover seleção (Shift = 10×)']]],
  ['Vista', [['Ctrl + roda', 'Zoom'], ['Ctrl +  /  Ctrl −', 'Aumentar / diminuir zoom'], ['Ctrl+0', 'Zoom 100%'], ['Ctrl+1', 'Ajustar à janela'], ['Espaço + arrastar', 'Mover a vista'], ['Ctrl+F', 'Localizar elemento']]],
  ['Desenho', [['Esc', 'Cancelar ferramenta / seleção'], ['Duplo clique', 'Editar texto'], ['Clique direito', 'Menu de contexto'], ['Shift + clique', 'Adicionar à seleção']]],
];
const About = {
  open() {
    UI.dialog({ title: 'Sobre o UNIMAP', width: 440, body: `<div class="about"><img src="${LOGO_FULL}" alt="UNI Smart Outsourcing Solutions"><h2>UNIMAP</h2><p>Modelador de processos BPMN 2.0 com abertura e gravação de arquivos <b>.bpm</b>.</p><p class="hint">Versão ${APP_VERSION} · funciona 100% offline, direto no navegador.<br>Os dados ficam no seu computador; nada é enviado para a internet.</p></div>`, buttons: [{ label: 'Fechar', primary: true }] });
  },
  shortcuts() {
    UI.dialog({ title: 'Atalhos de teclado', width: 560, body: `<div class="sc-grid">${SHORTCUTS.map(([t, l]) => `<h4>${t}</h4>${l.map(([k, d]) => `<div class="sc-r"><kbd>${U.esc(k)}</kbd><span>${U.esc(d)}</span></div>`).join('')}`).join('')}</div>`, buttons: [{ label: 'Fechar', primary: true }] });
  },
};

/* ---------- atalhos de teclado ---------- */
function keyboard() {
  window.addEventListener('keydown', e => {
    if (document.querySelector('.modal-bk,.backstage')) return;
    if (View.isTyping(e)) return;
    const ctrl = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    const run = (c) => { e.preventDefault(); UI.run(c); };
    if (ctrl) {
      if (k === 'n') return run('new'); if (k === 'o') return run('open');
      if (k === 's') return run(e.shiftKey ? 'saveas' : 'save');
      if (k === 'z') return run(e.shiftKey ? 'redo' : 'undo'); if (k === 'y') return run('redo');
      if (k === 'x') return run('cut'); if (k === 'c') return run('copy'); if (k === 'v') return run('paste');
      if (k === 'd') return run('duplicate'); if (k === 'a') return run('selectAll'); if (k === 'f') return run('find'); if (k === 'p') return run('print');
      if (k === '0') { e.preventDefault(); View.setZoom(1); return; } if (k === '1') { e.preventDefault(); View.fit(); return; }
      if (k === '=' || k === '+') { e.preventDefault(); View.setZoom(View.stepZoom(1)); return; } if (k === '-') { e.preventDefault(); View.setZoom(View.stepZoom(-1)); return; }
      return;
    }
    if (k === 'delete' || k === 'backspace') { if (Ed.sel.size) { e.preventDefault(); UI.run('delete'); } return; }
    if (k === 'f2' || (k === 'enter' && Ed.sel.size === 1)) { e.preventDefault(); UI.run('rename'); return; }
    if (k === 'escape') { if (Ed.tool) { Ed.tool = null; UI.armedChanged(); View.schedule(); } else Ed.clearSel(); UI.closeMenus(); return; }
    if (k.startsWith('arrow') && Ed.sel.size) {
      const st = e.shiftKey ? 10 : 1; const dx = k === 'arrowleft' ? -st : k === 'arrowright' ? st : 0, dy = k === 'arrowup' ? -st : k === 'arrowdown' ? st : 0;
      const items = Ed.movableSel(); if (!items.length) return; e.preventDefault();
      if (Ed._nudgeT) clearTimeout(Ed._nudgeT); else Ed.checkpoint();
      for (const o of items) Sc.moveBy(o.n, dx, dy);
      Ed.rerouteFor(items.map(o => o.id)); Ed.commit();
      Ed._nudgeT = setTimeout(() => { Ed._nudgeT = 0; }, 600);
    }
  });
}

/* ---------- inicialização ---------- */
async function boot() {
  $$('i.ph[data-ico]').forEach(el => { el.outerHTML = ico(el.dataset.ico, 18); });
  View.init(); UI.buildRibbon(); UI.tabsInit(); Panels.init(); keyboard();
  Ed.on('diagram', () => { UI.refresh(); });
  Ed.on('change', () => { UI.refresh(); File.scheduleAutosave(); });
  Ed.on('selection', () => UI.refresh());
  Ed.on('zoom', () => UI.refresh());
  Ed.on('model', () => UI.refresh());
  $('#qSave').onclick = () => UI.run('save'); $('#qUndo').onclick = () => UI.run('undo'); $('#qRedo').onclick = () => UI.run('redo');
  $$('.pnl-toggle').forEach(b => b.onclick = () => Panels.toggle(b.dataset.target));
  $('#zoomRange').oninput = e => View.setZoom(+e.target.value / 100);
  $('#zoomOutBtn').onclick = () => View.setZoom(View.stepZoom(-1)); $('#zoomInBtn').onclick = () => View.setZoom(View.stepZoom(1)); $('#zoomFitBtn').onclick = () => View.fit();
  $('#brand').onclick = () => About.open();
  window.addEventListener('beforeunload', e => { if (Ed.dirty) { e.preventDefault(); e.returnValue = ''; } });
  /* arrastar e soltar .bpm */
  window.addEventListener('dragover', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
  window.addEventListener('drop', async e => {
    if (!e.dataTransfer || !e.dataTransfer.files.length) return; e.preventDefault();
    const f = e.dataTransfer.files[0]; if (!/\.bpm$/i.test(f.name)) { UI.toast('Solte um arquivo .bpm'); return; }
    if (!await File.confirmDiscard()) return; await File.loadBuffer(new Uint8Array(await f.arrayBuffer()), f.name, null);
  });
  Ed.setModel(Model.newModel());
  View.fit();
  const restored = await File.tryRestore();
  if (!restored && !localStorage.getItem('unimap.welcomed')) {
    try { localStorage.setItem('unimap.welcomed', '1'); } catch (_) {}
    UI.toast('Bem-vindo ao UNIMAP! Arraste um arquivo .bpm para cá ou use Arquivo ▸ Abrir.', 6000);
  }
  document.body.classList.add('ready');
  window.__unimapReady = true;
}
document.addEventListener('DOMContentLoaded', () => { boot().catch(e => { console.error(e); document.body.insertAdjacentHTML('beforeend', `<pre style="position:fixed;inset:0;background:#fff;color:#b00;padding:20px;z-index:99999;white-space:pre-wrap">Erro ao iniciar o UNIMAP:\n${String(e && e.stack || e)}</pre>`); }); });

</script>

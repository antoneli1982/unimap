   UNIMAP – editor: estado, roteamento, comandos, desfazer/refazer
   =========================================================== */
'use strict';

/* ---------- roteador ortogonal de conectores ---------- */
const Router = {
  box(o) {
    /* caixa de ancoragem: eventos são círculos centrados */
    const r = Sc.rect(o.n);
    if (o.kind === 'start' || o.kind === 'inter' || o.kind === 'end') {
      const d = Math.min(r.w, r.h), cx = r.x + r.w / 2, cy = r.y + r.h / 2;
      return { x: cx - d / 2, y: cy - d / 2, w: d, h: d };
    }
    return r;
  },
  route(A, B, hint = {}) {
    const ax = A.x + A.w / 2, ay = A.y + A.h / 2, bx = B.x + B.w / 2, by = B.y + B.h / 2;
    const G = 24;
    const P = (x, y) => ({ x: Math.round(x * 100) / 100, y: Math.round(y * 100) / 100 });
    const out = [];
    if (B.x >= A.x + A.w + G * 0.6) {                    /* destino à direita */
      if (Math.abs(ay - by) < 3) return [P(A.x + A.w, ay), P(B.x, ay)];
      const mx = Math.round((A.x + A.w + B.x) / 2);
      return [P(A.x + A.w, ay), P(mx, ay), P(mx, by), P(B.x, by)];
    }
    if (B.x + B.w <= A.x - G * 0.6) {                    /* destino à esquerda */
      if (Math.abs(ay - by) < 3) return [P(A.x, ay), P(B.x + B.w, ay)];
      const mx = Math.round((A.x + B.x + B.w) / 2);
      return [P(A.x, ay), P(mx, ay), P(mx, by), P(B.x + B.w, by)];
    }
    if (B.y >= A.y + A.h) {                              /* sobrepostos em x, destino abaixo */
      if (Math.abs(ax - bx) < 3) return [P(ax, A.y + A.h), P(ax, B.y)];
      const my = Math.round((A.y + A.h + B.y) / 2);
      return [P(ax, A.y + A.h), P(ax, my), P(bx, my), P(bx, B.y)];
    }
    if (B.y + B.h <= A.y) {                              /* destino acima */
      if (Math.abs(ax - bx) < 3) return [P(ax, A.y), P(ax, B.y + B.h)];
      const my = Math.round((A.y + B.y + B.h) / 2);
      return [P(ax, A.y), P(ax, my), P(bx, my), P(bx, B.y + B.h)];
    }
    /* sobreposição total: contorna por baixo */
    const yy = Math.max(A.y + A.h, B.y + B.h) + G;
    return [P(ax, A.y + A.h), P(ax, yy), P(bx, yy), P(bx, B.y + B.h)];
  },
  /* remove pontos duplicados/colineares */
  clean(pts) {
    const out = [];
    for (const p of pts) {
      const l = out[out.length - 1];
      if (l && Math.abs(l.x - p.x) < 0.01 && Math.abs(l.y - p.y) < 0.01) continue;
      out.push({ x: p.x, y: p.y });
    }
    for (let i = out.length - 2; i > 0; i--) {
      const a = out[i - 1], b = out[i], c = out[i + 1];
      if ((Math.abs(a.x - b.x) < 0.01 && Math.abs(b.x - c.x) < 0.01) || (Math.abs(a.y - b.y) < 0.01 && Math.abs(b.y - c.y) < 0.01)) out.splice(i, 1);
    }
    return out;
  },
  /* ponto de ancoragem de uma caixa na direção (px,py) */
  anchor(box, px, py) {
    const cx = box.x + box.w / 2, cy = box.y + box.h / 2;
    const dx = px - cx, dy = py - cy;
    if (Math.abs(dx) * box.h > Math.abs(dy) * box.w) return { x: dx > 0 ? box.x + box.w : box.x, y: cy };
    return { x: cx, y: dy > 0 ? box.y + box.h : box.y };
  },
};

/* ---------- editor ---------- */
const Ed = {
  model: null, d: null, idx: null,
  sel: new Set(),
  zoom: 1,
  showGrid: true, snap: true, gridSize: 10,
  tool: null,               // {type:'add',kind,opts} | {type:'conn',kind} | null
  clipboard: null,
  fileHandle: null,
  dirty: false,
  listeners: new Map(),
  UNDO_MAX: 60,

  on(ev, fn) { if (!this.listeners.has(ev)) this.listeners.set(ev, []); this.listeners.get(ev).push(fn); },
  emit(ev, ...a) { for (const fn of this.listeners.get(ev) || []) { try { fn(...a); } catch (e) { console.error(e); } } },

  /* ---------- modelo / diagrama ---------- */
  setModel(m, fileHandle = null) {
    this.model = m; this.fileHandle = fileHandle; this.dirty = false;
    for (const d of m.diagrams) { d.undo = []; d.redo = []; d.view = d.view || { zoom: 1, sx: 0, sy: 0, fit: true }; }
    this.openDiagram(m.diagrams[0] ? 0 : -1);
    this.emit('model');
  },
  /* abre o diagrama que o usuário tinha ativo (UserPreferences), se houver */
  openDiagram(i) {
    const d = typeof i === 'number' ? this.model.diagrams[i] : i;
    this.d = d; this.sel.clear(); this.tool = null;
    if (d) this.reindex();
    this.emit('diagram'); this.emit('selection');
  },
  reindex() { this.idx = Sc.index(this.d); },
  get(id) { return this.idx.byId.get(id); },
  selected() { return [...this.sel].map(id => this.get(id)).filter(Boolean); },

  /* ---------- alteração + desfazer ---------- */
  snapshot() { return { root: structuredClone(this.d.doc.root), parts: structuredClone(this.model.participants.root) }; },
  checkpoint() {           /* chame ANTES de alterar */
    const d = this.d; d.undo.push(this.snapshot()); if (d.undo.length > this.UNDO_MAX) d.undo.shift(); d.redo.length = 0;
    this._cpOpen = true;
  },
  /* confirma uma alteração (marca sujo e redesenha) */
  commit({ keepSel = true } = {}) {
    this.d.dirty = true; this.dirty = true; this.model.dirty = true;
    this.reindex();
    if (!keepSel) this.sel.clear(); else for (const id of [...this.sel]) if (!this.idx.byId.has(id)) this.sel.delete(id);
    this.emit('change'); this.emit('selection');
  },
  /* atalho: checkpoint + função + commit */
  do(fn, opts) { this.checkpoint(); const r = fn(); this.commit(opts); return r; },
  undo() {
    const d = this.d; if (!d || !d.undo.length) return;
    d.redo.push(this.snapshot()); const s = d.undo.pop(); this._restore(s);
  },
  redo() {
    const d = this.d; if (!d || !d.redo.length) return;
    d.undo.push(this.snapshot()); const s = d.redo.pop(); this._restore(s);
  },
  _restore(s) {
    this.d.doc.root = structuredClone(s.root); this.model.participants.root = structuredClone(s.parts);
    this.d.dirty = true; this.dirty = true;
    this.reindex();
    for (const id of [...this.sel]) if (!this.idx.byId.has(id)) this.sel.delete(id);
    this.emit('change'); this.emit('selection');
  },

  /* ---------- seleção ---------- */
  select(ids, add = false) {
    if (!add) this.sel.clear();
    for (const id of [].concat(ids)) if (id) this.sel.add(id);
    this.emit('selection');
  },
  toggle(id) { this.sel.has(id) ? this.sel.delete(id) : this.sel.add(id); this.emit('selection'); },
  clearSel() { if (this.sel.size) { this.sel.clear(); this.emit('selection'); } },
  selectAll() { this.sel = new Set([...this.idx.acts, ...this.idx.arts, ...this.idx.flows, ...this.idx.assocs, ...this.idx.msgs].map(o => o.id)); this.emit('selection'); },

  /* ---------- grade ---------- */
  sn(v, force) { return (this.snap || force) && !this._noSnap ? Math.round(v / this.gridSize) * this.gridSize : v; },

  /* ---------- processo de destino ---------- */
  processForPoint(x, y) {
    const po = Sc.poolAt(this.idx, x, y);
    let proc = null;
    if (po && po.n.a.Process) proc = Sc.processes(this.d).find(p => p.a.Id === po.n.a.Process);
    if (!proc) {
      const visible = this.idx.pools.find(p => p.n.a.BoundaryVisible !== 'false');
      if (visible && visible.n.a.Process) proc = Sc.processes(this.d).find(p => p.a.Id === visible.n.a.Process);
    }
    if (!proc) proc = Sc.processes(this.d).find(p => X.q(p, 'Activities')) || Sc.processes(this.d)[0];
    return proc;
  },
  PROC_ORDER: ['ProcessHeader', 'RedefinableHeader', 'ActivitySets', 'DataInputOutputs', 'DataObjects', 'Activities', 'Transitions', 'ExtendedAttributes'],
  procList(proc, tag) {
    let l = X.q(proc, tag);
    if (!l) l = X.insertOrdered(proc, E(tag), this.PROC_ORDER);
    return l;
  },
  ROOT_ORDER: ['PackageHeader', 'RedefinableHeader', 'ExternalPackages', 'Participants', 'Pools', 'MessageFlows', 'Associations', 'Artifacts', 'WorkflowProcesses', 'ExtendedAttributes'],
  rootList(tag) {
    const root = this.d.doc.root;
    let l = X.q(root, tag);
    if (!l) l = X.insertOrdered(root, E(tag), this.ROOT_ORDER);
    return l;
  },

  /* ---------- criação ---------- */
  addActivity(kind, opts, cx, cy) {
    const def = Sc.SIZE[kind] || [155, 60];
    const w = opts.w || def[0], h = opts.h || def[1];
    const x = Math.round(this.sn(cx - w / 2)), y = Math.round(this.sn(cy - h / 2));
    const act = Sc.makeActivity(kind, Object.assign({}, opts, { x, y, w, h }));
    const proc = this.processForPoint(cx, cy);
    this.procList(proc, 'Activities').c.push(act);
    return act;
  },
  addAnnotation(cx, cy, text = 'Anotação') {
    const a = Sc.makeAnnotation(Math.round(this.sn(cx - 80)), Math.round(this.sn(cy - 30)), text);
    this.rootList('Artifacts').c.push(a); return a;
  },
  addGroup(cx, cy) { const a = Sc.makeGroup(Math.round(this.sn(cx - 150)), Math.round(this.sn(cy - 100))); this.rootList('Artifacts').c.push(a); return a; },
  addCustomArtifact(typeId, cx, cy, name) {
    const at = this.model.artifactTypes.find(a => a.id === typeId);
    let w = 96, h = 96;
    const a = Sc.makeCustomArtifact(typeId, Math.round(this.sn(cx - w / 2)), Math.round(this.sn(cy - h / 2)), w, h, name || '');
    this.rootList('Artifacts').c.push(a); return a;
  },
  addDataArtifact(kind, cx, cy) {
    const store = kind === 'DataStore';
    const w = store ? 56 : 40, h = store ? 50 : 50;
    const a = E('Artifact', { BizAgiArtifactTypeSpecified: 'false', Id: U.uuid(), ArtifactType: kind, Name: store ? 'Repositório' : 'Objeto de dados' }, [
      Sc.nodeGfx({ x: Math.round(this.sn(cx - w / 2)), y: Math.round(this.sn(cy - h / 2)), w, h, border: U.fromCss('#7F7F7F'), fill: U.fromCss('#F4F4F4') }), E('Documentation')]);
    this.rootList('Artifacts').c.push(a); return a;
  },
  validConn(from, to, kind) {
    if (!from || !to || from.id === to.id) return false;
    if (kind === 'assoc') return true;
    if (!from.act || !to.act) return false;
    if (from.kind === 'end') return false;
    if (to.kind === 'start') return false;
    return true;
  },
  /* cria conector (decide sequência × mensagem automaticamente) */
  connect(from, to, kind = 'flow') {
    if (!this.validConn(from, to, kind)) return null;
    const A = from.act ? Router.box(from) : Sc.rect(from.n), B = to.act ? Router.box(to) : Sc.rect(to.n);
    const pts = Router.clean(Router.route(A, B));
    if (kind === 'assoc') {
      const a = Sc.makeAssociation(pts, { source: from.id, target: to.id });
      this.rootList('Associations').c.push(a); return a;
    }
    const pf = Sc.poolAt(this.idx, ...Object.values(this._center(from))), pt = Sc.poolAt(this.idx, ...Object.values(this._center(to)));
    const cross = kind === 'msg' || (pf && pt && pf !== pt);
    if (cross) {
      const m = E('MessageFlow', { Id: U.uuid(), Source: from.id, Target: to.id }, [Sc.connGfx(pts, { border: -16777216, align: 'Near' }), E('ExtendedAttributes')]);
      this.rootList('MessageFlows').c.push(m); return m;
    }
    const proc = from.proc;
    const type = from.kind === 'gateway' ? 'CONDITION' : null;
    const t = Sc.makeFlow(from.id, to.id, pts, { type: type && this._gatewayNeedsCond(from) ? type : null });
    this.procList(proc, 'Transitions').c.push(t);
    return t;
  },
  _gatewayNeedsCond(from) { const gt = Sc.gatewayType(from.n); return gt === 'Exclusive' || gt === 'ExclusiveNoMarker' || gt === 'Inclusive'; },
  _center(o) { const r = Sc.rect(o.n); return { x: r.x + r.w / 2, y: r.y + r.h / 2 }; },

  /* reroteia todos os fluxos ligados a um conjunto de ids */
  rerouteFor(ids, { skipBoth = false } = {}) {
    const touch = new Set(ids);
    for (const f of [...this.idx.flows, ...this.idx.msgs, ...this.idx.assocs]) {
      const from = f.n.a.From || f.n.a.Source, to = f.n.a.To || f.n.a.Target;
      if (!touch.has(from) && !touch.has(to)) continue;
      const a = this.get(from), b = this.get(to);
      if (!a || !b) continue;
      const A = a.act ? Router.box(a) : Sc.rect(a.n), B = b.act ? Router.box(b) : Sc.rect(b.n);
      Sc.setPts(f.n, Router.clean(Router.route(A, B)));
      // desfaz portas fixas (a geometria agora é automática)
      const g = Sc.cgfx(f.n); if (g) { delete g.a.FromPort; delete g.a.ToPort; }
      if (f.n.t === 'Transition' && f.n.a.Name) this._autoLabel(f.n);
    }
  },
  _autoLabel(t) {
    const g = Sc.cgfx(t); if (!g) return;
    const b = Sc.defaultFlowText(Sc.pts(t)); Sc.setFlowLabelBox(t, b);
  },

  /* ---------- edição de propriedades ---------- */
  rename(o, name) {
    const n = o.n;
    if (o.kind === 'art') { if (n.a.ArtifactType === 'Annotation' || n.a.TextAnnotation !== undefined) n.a.TextAnnotation = name; else n.a.Name = name; }
    else n.a.Name = name;
    if (o.kind === 'flow' && !name) { const g = Sc.cgfx(n); if (g) for (const k of ['TextX', 'TextY', 'TextWidth', 'TextHeight']) delete g.a[k]; }
    else if (o.kind === 'flow') this._autoLabel(n);
    if (o.kind === 'pool' && n.a.Process) { const p = Sc.processes(this.d).find(p => p.a.Id === n.a.Process); if (p) p.a.Name = name; }
  },
  nameOf(o) {
    if (o.kind === 'art') return o.n.a.TextAnnotation !== undefined && o.n.a.ArtifactType === 'Annotation' ? o.n.a.TextAnnotation : (o.n.a.Name || o.n.a.TextAnnotation || '');
    return o.n.a.Name || '';
  },
  setTaskType(a, id) {
    let impl = X.q(a, 'Implementation'); if (!impl) return;
    const tt = TASK_TYPES.find(t => t.id === id) || TASK_TYPES[0];
    const fresh = Sc.makeActivity('task', { x: 0, y: 0, taskType: id });
    impl.c = [structuredClone(X.q(fresh, 'Implementation/Task'))];
    // atributos de execução (RuntimeProperties) acompanham o tipo
    const ea = X.q(a, 'ExtendedAttributes'); const fe = X.q(fresh, 'ExtendedAttributes');
    if (ea && fe) ea.c = ea.c.filter(c => c.a.Name !== 'RuntimeProperties').concat(structuredClone(fe.c));
  },
  setGatewayType(a, id) {
    const r = X.q(a, 'Route'); const g = GATEWAY_TYPES.find(x => x.id === id); if (!r || !g) return;
    r.a = Object.assign({}, g.attrs);
  },
  setTrigger(a, trig) {
    const ev = X.q(a, 'Event'); if (!ev) return;
    const old = ev.c[0]; const tag = old.t;
    const nn = Sc.eventNode(tag, trig);
    if (tag === 'IntermediateEvent' && old.a.Target) nn.a.Target = old.a.Target;
    ev.c[0] = nn;
  },
  setIntermediateKind(a, throwing) {
    const e = X.q(a, 'Event/IntermediateEvent'); if (!e) return;
    for (const c of e.c) if ('CatchThrow' in c.a) c.a.CatchThrow = throwing ? 'THROW' : 'CATCH';
  },
  setLoop(a, type) {
    let l = X.q(a, 'Loop');
    if (!l) { l = E('Loop', { LoopType: 'None' }); const at = a.c.findIndex(c => c.t === 'NodeGraphicsInfos'); a.c.splice(at, 0, l); }
    l.a = { LoopType: type };
  },
  /* tipo de condição do fluxo */
  setCondition(t, type, expr) {
    const i = t.c.findIndex(c => c.t === 'Condition');
    let nc;
    if (type === 'CONDITION') nc = E('Condition', { Type: 'CONDITION' }, [E('Expression', {}, expr || '')]);
    else if (type === 'OTHERWISE') nc = E('Condition', { Type: 'OTHERWISE' });
    else nc = E('Condition');
    if (i >= 0) t.c[i] = nc; else t.c.unshift(nc);
  },

  /* ---------- exclusão ---------- */
  deleteIds(ids) {
    const del = new Set(ids);
    // fluxos ligados a elementos apagados também saem
    for (const f of [...this.idx.flows, ...this.idx.msgs, ...this.idx.assocs]) {
      if (del.has(f.n.a.From) || del.has(f.n.a.To) || del.has(f.n.a.Source) || del.has(f.n.a.Target)) del.add(f.id);
    }
    const rm = n => { for (const l of this._lists()) { const i = l.c.indexOf(n); if (i >= 0) { l.c.splice(i, 1); return true; } } return false; };
    for (const id of del) {
      const o = this.get(id); if (!o) continue;
      if (o.kind === 'lane') this.deleteLane(o);
      else if (o.kind === 'pool') this.deletePool(o);
      else rm(o.n);
      // limpa referência no ExtendedAttributeValues
    }
    this._cleanEav(del);
  },
  _lists() {
    const out = [];
    for (const p of Sc.processes(this.d)) for (const t of ['Activities', 'Transitions', 'DataObjects']) { const l = X.q(p, t); if (l) out.push(l); }
    for (const t of ['Associations', 'Artifacts', 'MessageFlows']) { const l = X.q(this.d.doc.root, t); if (l) out.push(l); }
    return out;
  },
  _cleanEav(del) {
    const eav = this.d.eav; if (!eav) return;
    eav.root.c = eav.root.c.filter(c => !del.has(c.a.ElementId));
  },
  deleteLane(o) {
    const pool = o.pool; const lanes = X.q(pool.n, 'Lanes');
    const h = Sc.rect(o.n).h;
    lanes.c = lanes.c.filter(l => l !== o.n);
    const g = Sc.gfx(pool.n); g.a.Height = String(Math.max(60, X.num(g.a.Height) - h));
    this.relayoutLanes(pool.n);
  },
  deletePool(o) {
    const pools = X.q(this.d.doc.root, 'Pools'); pools.c = pools.c.filter(p => p !== o.n);
    const proc = Sc.processes(this.d).find(p => p.a.Id === o.n.a.Process);
    // atividades do pool apagado
    if (proc) { const wp = X.q(this.d.doc.root, 'WorkflowProcesses'); wp.c = wp.c.filter(p => p !== proc); }
  },
  /* mantém y/height das raias coerentes (y relativo, acumulado) */
  relayoutLanes(poolN) {
    const lanes = X.qa(X.q(poolN, 'Lanes'), 'Lane'); const pr = Sc.rect(poolN);
    let y = 0;
    for (const l of lanes) {
      const g = Sc.gfx(l); const c = X.q(g, 'Coordinates');
      c.a.XCoordinate = '50'; c.a.YCoordinate = String(y);
      g.a.Width = String(pr.w - 50);
      y += X.num(g.a.Height);
    }
  },
  addLane(poolO, index = -1, name) {
    const pool = poolO.n, lanes = this.procListLanes(pool);
    const pr = Sc.rect(pool), existing = X.qa(lanes, 'Lane');
    const total = existing.reduce((s, l) => s + Sc.rect(l).h, 0);
    let h = 150;
    if (!existing.length) { h = pr.h; }
    else Sc.gfx(pool).a.Height = String(pr.h + h);
    const lane = Sc.makeLane(pool.a.Id, name || 'Raia ' + (existing.length + 1), pr.w - 50, h, total);
    if (index < 0 || index > existing.length) lanes.c.push(lane); else lanes.c.splice(index, 0, lane);
    this.relayoutLanes(pool);
    return lane;
  },
  procListLanes(pool) { let l = X.q(pool, 'Lanes'); if (!l) { l = E('Lanes'); pool.c.unshift(l); } return l; },
  addPool(name = 'Novo processo') {
    const b = Sc.bounds(this.d, this.idx);
    const visible = this.idx.pools.filter(p => p.n.a.BoundaryVisible !== 'false');
    let x = 30, y = 30;
    if (visible.length) { const ref = visible.map(p => Sc.rect(p.n)); x = Math.min(...ref.map(r => r.x)); y = Math.max(...ref.map(r => r.y + r.h)) + 30; }
    const proc = Sc.makeProcess(name);
    X.q(this.d.doc.root, 'WorkflowProcesses').c.push(proc);
    const pool = Sc.makePool(name, x, y, 700, 250, proc.a.Id);
    X.q(this.d.doc.root, 'Pools').c.push(pool);
    return pool;
  },

  /* ---------- organização ---------- */
  movableSel() { return this.selected().filter(o => o.act || o.kind === 'art'); },
  align(mode) {
    const items = this.movableSel(); if (items.length < 2) return;
    const rs = items.map(o => Sc.rect(o.n));
    const L = Math.min(...rs.map(r => r.x)), R = Math.max(...rs.map(r => r.x + r.w)), T = Math.min(...rs.map(r => r.y)), B = Math.max(...rs.map(r => r.y + r.h));
    this.do(() => {
      items.forEach((o, i) => {
        const r = rs[i]; let nx = r.x, ny = r.y;
        if (mode === 'left') nx = L; else if (mode === 'right') nx = R - r.w; else if (mode === 'center') nx = (L + R) / 2 - r.w / 2;
        else if (mode === 'top') ny = T; else if (mode === 'bottom') ny = B - r.h; else if (mode === 'middle') ny = (T + B) / 2 - r.h / 2;
        Sc.setRect(o.n, { x: Math.round(nx), y: Math.round(ny), w: r.w, h: r.h });
      });
      this.rerouteFor(items.map(o => o.id));
    });
  },
  distribute(axis) {
    const items = this.movableSel(); if (items.length < 3) return;
    const H = axis === 'h';
    const arr = items.map(o => ({ o, r: Sc.rect(o.n) })).sort((a, b) => H ? a.r.x - b.r.x : a.r.y - b.r.y);
    const first = arr[0].r, last = arr[arr.length - 1].r;
    const total = H ? (last.x + last.w - first.x) : (last.y + last.h - first.y);
    const sizes = arr.reduce((s, a) => s + (H ? a.r.w : a.r.h), 0);
    const gap = (total - sizes) / (arr.length - 1);
    this.do(() => {
      let pos = H ? first.x : first.y;
      for (const a of arr) {

  },
  sameSize(which) {

  },
  zOrder(mode) {

  /* ---------- área de transferência ---------- */
  copy() {

  cut() { if (this.copy()) this.do(() => this.deleteIds(this.selected().filter(o => o.act || o.kind === 'art').map(o => o.id)), { keepSel: false }); },
  paste(at) {

    const proc = this.processForPoint(at ? at.x : 0, at ? at.y : 0);
    const shiftAll = (n, dx, dy) => { Sc.moveBy(n, dx, dy); };
    let dx = off, dy = off;

      const n = structuredClone(src); const old = n.a.Id; n.a.Id = U.uuid(); map.set(old, n.a.Id);
      shiftAll(n, dx, dy); this.rootList('Artifacts').c.push(n); newIds.push(n.a.Id);
    }
    for (const f of cb.flows) {
      const n = structuredClone(f.n); n.a.Id = U.uuid();
      for (const k of ['From', 'To', 'Source', 'Target']) if (n.a[k]) n.a[k] = map.get(n.a[k]) || n.a[k];
      Sc.setPts(n, Sc.pts(n).map(p => ({ x: p.x + dx, y: p.y + dy })));

      else this.rootList('Associations').c.push(n);
    }
    this.commit(); this.select(newIds);
  },
  duplicate() { if (this.copy()) { this.clipboard.pasteCount = 0; this.paste(); } },
};

/* ===========================================================

'use strict';

const View = {
  wrap: null, svg: null, content: null, overlay: null, gridRect: null, editor: null, quick: null,
  world: { x0: 0, y0: 0, w: 1000, h: 800 },
  drag: null,
  space: false,
  raf: 0,
  hover: null,
  ZOOMS: [0.1, 0.15, 0.2, 0.25, 0.33, 0.5, 0.67, 0.75, 0.8, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2, 2.5, 3, 4],

  init() {
    this.wrap = document.getElementById('canvasWrap');
    this.svg = document.getElementById('stage');
    this.content = document.getElementById('content');
    this.overlay = document.getElementById('overlay');
    this.gridRect = document.getElementById('gridRect');
    this.editor = document.getElementById('inlineEditor');
    this.quick = document.getElementById('quickbar'); this.quickInit();
    const s = this.svg;
    s.addEventListener('pointerdown', e => this.down(e));
    s.addEventListener('pointermove', e => this.move(e));
    s.addEventListener('pointerup', e => this.up(e));
    s.addEventListener('pointercancel', e => this.up(e, true));
    s.addEventListener('dblclick', e => this.dbl(e));
    s.addEventListener('contextmenu', e => this.ctx(e));
    this.wrap.addEventListener('wheel', e => this.wheel(e), { passive: false });
    this.wrap.addEventListener('scroll', () => { this.positionQuick(); this.closeEditor(true); });
    this.wrap.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('application/x-unimap')) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; } });
    this.wrap.addEventListener('drop', e => this.dropPalette(e));
    window.addEventListener('keydown', e => { if (e.code === 'Space' && !this.isTyping(e)) { this.space = true; this.wrap.classList.add('panning'); if (e.target === document.body) e.preventDefault(); } });
    window.addEventListener('keyup', e => { if (e.code === 'Space') { this.space = false; this.wrap.classList.remove('panning'); } });
    window.addEventListener('resize', () => this.schedule());
    Ed.on('change', () => this.schedule());
    Ed.on('selection', () => this.schedule());
    Ed.on('diagram', () => this.onDiagram());
    new ResizeObserver(() => this.schedule()).observe(this.wrap);
    this.editor.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.preventDefault(); this.closeEditor(true); }
      else if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.closeEditor(false); }
      e.stopPropagation();
    });
    this.editor.addEventListener('blur', () => this.closeEditor(false));
    this.editor.addEventListener('input', () => this.autoSizeEditor());
  },
  isTyping(e) { const t = e.target; return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable); },
  ctxImages() {
    return { artifactImage: id => { const a = Ed.model.artifactTypes.find(x => x.id === id); return a && a.image ? 'data:image/png;base64,' + a.image : null; } };
  },

  /* ---------- conversões ---------- */
  toWorld(e) {
    const r = this.svg.getBoundingClientRect(), z = Ed.zoom;

  },
  toScreen(x, y) { const r = this.wrap.getBoundingClientRect(); const sr = this.svg.getBoundingClientRect(); return { x: sr.left + (x - this.world.x0) * Ed.zoom - r.left, y: sr.top + (y - this.world.y0) * Ed.zoom - r.top }; },

  /* ---------- desenho ---------- */
  schedule() { if (!this.raf) this.raf = requestAnimationFrame(() => { this.raf = 0; this.draw(); }); },
  onDiagram() {
    this.closeEditor(true);
    const d = Ed.d; if (!d) { this.content.innerHTML = ''; this.overlay.innerHTML = ''; return; }
    d.view = d.view || { zoom: 1, fit: true };
    Ed.zoom = d.view.zoom || 1;
    this.computeWorld(true);
    this.draw();
    requestAnimationFrame(() => {
      if (d.view.fit) { this.fit(false); d.view.fit = false; }
      else { this.wrap.scrollLeft = d.view.sx || 0; this.wrap.scrollTop = d.view.sy || 0; }
    });
    Ed.emit('zoom');
  },
  computeWorld(initial) {
    const b = Sc.bounds(Ed.d, Ed.idx);
    const cw = this.wrap.clientWidth / Ed.zoom, ch = this.wrap.clientHeight / Ed.zoom;
    const x0 = Math.min(0, Math.floor((b.x - 150) / 50) * 50), y0 = Math.min(0, Math.floor((b.y - 150) / 50) * 50);
    const x1 = Math.max(b.x + b.w + 400, x0 + cw), y1 = Math.max(b.y + b.h + 300, y0 + ch);

  /* ---------- sobreposição: seleção, alças, guias ---------- */

          ov.push(hnd(ax - 3, ay - 3, 'nw', 'nwse-resize'), hnd(bx + 3, ay - 3, 'ne', 'nesw-resize'), hnd(ax - 3, by + 3, 'sw', 'nesw-resize'), hnd(bx + 3, by + 3, 'se', 'nwse-resize'));
          if (!fixed) ov.push(hnd(cx, ay - 3, 'n', 'ns-resize'), hnd(cx, by + 3, 's', 'ns-resize'), hnd(ax - 3, cy, 'w', 'ew-resize'), hnd(bx + 3, cy, 'e', 'ew-resize'));
          // etiqueta (eventos/gateways)
          if (o.kind === 'start' || o.kind === 'inter' || o.kind === 'end' || o.kind === 'gateway') {
            const lb = Sc.labelBox(o.n);
            ov.push(`<rect x="${lb.x}" y="${lb.y}" width="${lb.w}" height="${lb.h}" fill="none" stroke="${blue}" stroke-width="${1 / z}" stroke-dasharray="${2 / z},${3 / z}" opacity=".6" pointer-events="none"/>`);

  /* ---------- paleta rápida (estilo Bizagi): ao clicar num elemento, oferece criar o próximo ---------- */

  buildQuick(o) {

  positionQuick() {

  quickInit() {

      f.innerHTML = this.qflyHTML(cat); f.hidden = false; f.dataset.cat = id;
      f.style.top = '0px'; const br = btnEl.getBoundingClientRect(), qr = q.getBoundingClientRect(), wr = this.wrap.getBoundingClientRect();
      let top = br.top - qr.top; const h = f.offsetHeight; if (qr.top + top + h > wr.bottom - 6) top = wr.bottom - 6 - h - qr.top; f.style.top = Math.max(wr.top + 4 - qr.top, top) + 'px';

  /* posição livre à direita do elemento */
  freeSpot(o, kind) {

  tree: '<path d="M5 4v16M5 8h5M5 14h5M5 20h5"/><rect x="10" y="5.500" width="9" height="5" rx="1"/><rect x="10" y="11.500" width="9" height="5" rx="1"/>',
  palette: '<rect x="3" y="3" width="8" height="8" rx="1.500"/><rect x="13" y="3" width="8" height="8" rx="1.500"/><rect x="3" y="13" width="8" height="8" rx="1.500"/><circle cx="17" cy="17" r="4"/>',
  props: '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  check: '<path d="M5 12.500l4.500 4.500L19 7"/>',
  warn: '<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/>',
  split: '<path d="M4 12h8l6-6M12 12l6 6"/><path d="M18 4l3 2-3 2M18 16l3 2-3 2"/>',
  moon: '<path d="M20 14.500A8 8 0 1 1 9.500 4a6.500 6.500 0 0 0 10.500 10.500z"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
};
const ico = (name, size = 20, cls = '') => `<svg class="ico ${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;

/* ===========================================================
   UNIMAP – interface: diálogos, menus, comandos, ribbon, abas, status
   =========================================================== */
'use strict';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };

const UI = {
  openTabs: [],
  fontSizes: [6, 7, 8, 9, 10, 11, 12, 14, 16, 18, 20, 24, 28, 36, 48],
  fonts: ['Segoe UI', 'Arial', 'Calibri', 'Verdana', 'Tahoma', 'Times New Roman', 'Georgia', 'Courier New', 'Trebuchet MS', 'Consolas'],
  swatches: ['#000000', '#404040', '#7F7F7F', '#BFBFBF', '#FFFFFF', '#990000', '#CC0000', '#E0245E', '#FF8C00', '#FFA000', '#FFC000', '#FFFFCC', '#A6A61D', '#62A716', '#00A651', '#E6FF97', '#03689A', '#1F7AE0', '#00B0F0', '#ECEFFF', '#800080', '#7030A0', '#B4A7D6', '#F5F5F5', '#EEAAAA', '#F4CCCC', '#FCE5CD', '#FFF2CC', '#D9EAD3', '#CFE2F3', '#D9D2E9', '#EAD1DC'],
  recent: JSON.parse((() => { try { return localStorage.getItem('unimap.recentColors') || '[]'; } catch (_) { return '[]'; } })()),

  /* ---------- feedback ---------- */
  toast(msg, ms = 2600) {
    const t = h(`<div class="toast">${U.esc(msg)}</div>`);
    $('#toastRoot').appendChild(t);
    setTimeout(() => t.classList.add('out'), ms); setTimeout(() => t.remove(), ms + 400);
  },
  armedChanged() {
    const armed = !!Ed.tool;
    View.wrap.classList.toggle('tool-armed', armed);
    $$('.pal-item.armed').forEach(x => x.classList.remove('armed'));
    if (armed && Ed.tool.paletteKey) { const el = $(`.pal-item[data-key="${CSS.escape(Ed.tool.paletteKey)}"]`); if (el) el.classList.add('armed'); }
    $('#statusHint').textContent = armed ? (Ed.tool.type === 'conn' ? 'Conector: clique no elemento de origem e arraste até o destino (Esc cancela).' : 'Clique no diagrama para inserir o elemento (Shift mantém a ferramenta; Esc cancela).') : '';
  },

  /* ---------- diálogos ---------- */
  dialog({ title, body, buttons = [{ label: 'OK', primary: true }], width = 420, onOpen, cls = '' }) {
    return new Promise(resolve => {
      const bk = h(`<div class="modal-bk"><div class="modal ${cls}" role="dialog" aria-modal="true" style="width:${width}px"><div class="modal-h"><span>${U.esc(title)}</span><button class="x" aria-label="Fechar">${ico('close', 16)}</button></div><div class="modal-b"></div><div class="modal-f"></div></div></div>`);
      const b = $('.modal-b', bk);
      if (typeof body === 'string') b.innerHTML = body; else b.appendChild(body);
      const done = v => { bk.remove(); document.removeEventListener('keydown', key, true); resolve(v); };
      const key = e => { if (e.key === 'Escape') { e.stopPropagation(); done(null); } else if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'BUTTON') { const p = buttons.find(x => x.primary); if (p) { e.preventDefault(); p.click ? p.click(b, done) : done(p.value ?? true); } } };
      document.addEventListener('keydown', key, true);
      $('.x', bk).onclick = () => done(null);
      bk.addEventListener('mousedown', e => { if (e.target === bk) { /* clique fora não fecha */ } });
      const f = $('.modal-f', bk);
      for (const bt of buttons) {
        const el = h(`<button class="btn ${bt.primary ? 'primary' : ''}">${U.esc(bt.label)}</button>`);
        el.onclick = () => { if (bt.click) bt.click(b, done); else done(bt.value ?? (bt.primary ? true : null)); };
        f.appendChild(el);
      }
      $('#modalRoot').appendChild(bk);
      if (onOpen) onOpen(b, done);
      const first = $('input,textarea,select', b); if (first) { first.focus(); if (first.select) first.select(); } else { const pb = $('.btn.primary', f); pb && pb.focus(); }
    });
  },
  alert(title, msg) { return UI.dialog({ title, body: `<p class="msg">${msg}</p>`, buttons: [{ label: 'OK', primary: true }] }); },
  confirm(title, msg, ok = 'OK') { return UI.dialog({ title, body: `<p class="msg">${msg}</p>`, buttons: [{ label: 'Cancelar', value: false }, { label: ok, primary: true, value: true }] }).then(v => !!v); },
  prompt(title, label, value = '') {
    return UI.dialog({
      title, body: `<label class="fld"><span>${U.esc(label)}</span><input type="text" id="pv" value="${U.esc(value)}"></label>`,
      buttons: [{ label: 'Cancelar', value: null }, { label: 'OK', primary: true, click: (b, done) => done($('#pv', b).value) }],
    });
  },

  /* ---------- menus ---------- */
  closeMenus() { $$('.menu').forEach(m => m.remove()); },
  menu(x, y, items, { anchor } = {}) {
    UI.closeMenus();
    const build = (list, depth) => {
      const m = h(`<div class="menu ${depth ? 'sub' : ''}" role="menu"></div>`);
      for (const it of list) {
        if (it === '-' || it.sep) { m.appendChild(h('<div class="msep"></div>')); continue; }
        if (it.hidden) continue;
        const el = h(`<div class="mi ${it.disabled ? 'dis' : ''}" role="menuitem"><span class="mi-ic">${it.icon ? ico(it.icon, 16) : (it.checked ? ico('check', 16) : '')}</span><span class="mi-l">${U.esc(it.label)}</span><span class="mi-k">${it.key ? U.esc(it.key) : ''}</span>${it.sub ? `<span class="mi-s">${ico('chevR', 14)}</span>` : ''}</div>`);
        if (it.sub) {
          let subEl = null;
          el.addEventListener('mouseenter', () => { $$('.menu.sub', m).forEach(s => s.remove()); subEl = build(it.sub, depth + 1); document.body.appendChild(subEl); const r = el.getBoundingClientRect(); place(subEl, r.right - 2, r.top - 4); });
        } else {
          el.addEventListener('mouseenter', () => { $$('.menu.sub').forEach(s => { if (!m.contains(s)) s.remove(); }); });
          if (!it.disabled) el.onclick = () => { UI.closeMenus(); it.run && it.run(); };
        }
        m.appendChild(el);
      }
      return m;
    };
    const place = (m, px, py) => {
      m.style.left = '0px'; m.style.top = '0px';
      const r = m.getBoundingClientRect();
      m.style.left = Math.max(4, Math.min(px, innerWidth - r.width - 6)) + 'px';
      m.style.top = Math.max(4, Math.min(py, innerHeight - r.height - 6)) + 'px';
    };
    const root = build(items, 0); document.body.appendChild(root); place(root, x, y);
    setTimeout(() => { const off = ev => { if (!ev.target.closest('.menu')) { UI.closeMenus(); document.removeEventListener('pointerdown', off, true); } }; document.addEventListener('pointerdown', off, true); }, 0);
  },
  contextMenu(x, y, o, w) {
    const C = id => CMD[id];
    const it = id => ({ label: C(id).label, icon: C(id).icon, key: C(id).keyLabel, run: () => UI.run(id), disabled: C(id).enabled ? !C(id).enabled() : false });
    const items = [];
    if (o) {
      items.push({ label: 'Editar texto', icon: 'rename', key: 'F2', run: () => View.edit(o) });
      items.push('-');
      if (o.kind === 'task') items.push({ label: 'Tipo de tarefa', sub: TASK_TYPES.map(t => ({ label: t.label, checked: Sc.taskType(o.n) === t.id, run: () => Props.set(() => Ed.setTaskType(o.n, t.id)) })) });
      if (o.kind === 'gateway') items.push({ label: 'Tipo de gateway', sub: GATEWAY_TYPES.map(t => ({ label: t.label, checked: Sc.gatewayType(o.n) === t.id, run: () => Props.set(() => Ed.setGatewayType(o.n, t.id)) })) });
      if (o.kind === 'start' || o.kind === 'inter' || o.kind === 'end') { const list = o.kind === 'start' ? START_TRIGGERS : o.kind === 'inter' ? INTER_TRIGGERS : END_RESULTS; items.push({ label: 'Tipo de evento', sub: list.map(([id, l]) => ({ label: l, checked: Sc.trigger(o.n) === id, run: () => Props.set(() => Ed.setTrigger(o.n, id)) })) }); }
      if (o.kind === 'flow') items.push({ label: 'Condição', sub: [{ label: 'Sem condição', run: () => Props.set(() => Ed.setCondition(o.n, null)) }, { label: 'Condicional', run: () => Props.set(() => Ed.setCondition(o.n, 'CONDITION')) }, { label: 'Fluxo padrão', run: () => Props.set(() => Ed.setCondition(o.n, 'OTHERWISE')) }] });
      if (o.kind === 'lane') {
        items.push({ label: 'Adicionar raia acima', run: () => Props.set(() => { const i = X.qa(X.q(o.pool.n, 'Lanes'), 'Lane').indexOf(o.n); Ed.addLane(o.pool, i); }) });
        items.push({ label: 'Adicionar raia abaixo', run: () => Props.set(() => { const i = X.qa(X.q(o.pool.n, 'Lanes'), 'Lane').indexOf(o.n); Ed.addLane(o.pool, i + 1); }) });
      }
      if (o.kind === 'pool') items.push({ label: 'Adicionar raia', run: () => Props.set(() => Ed.addLane(o)) });
      if (items.length > 2) items.push('-');
      items.push(it('cut'), it('copy'), it('duplicate'), it('delete'), '-');
      if (o.act || o.kind === 'art') items.push(it('front'), it('back'));
    } else {
      items.push({ label: 'Colar', icon: 'paste', key: 'Ctrl+V', disabled: !Ed.clipboard, run: () => Ed.paste(w) });
      items.push(it('selectAll'), '-');
      items.push({ label: 'Adicionar tarefa aqui', icon: 'task', run: () => View.place({ kind: 'task' }, w.x, w.y) });
      items.push({ label: 'Adicionar anotação aqui', icon: 'note', run: () => View.place({ kind: 'annotation' }, w.x, w.y) });
      items.push('-', it('zoomFit'), it('toggleGrid'));
    }
    UI.menu(x, y, items);
  },

  /* ---------- comandos ---------- */
  run(id) { const c = CMD[id]; if (!c) return; if (c.enabled && !c.enabled()) return; try { const r = c.run(); if (r && r.catch) r.catch(e => { console.error(e); UI.alert('Erro', U.esc(e.message || e)); }); } catch (e) { console.error(e); UI.alert('Erro', U.esc(e.message || e)); } UI.refresh(); },
  hasSel() { return Ed.sel.size > 0; },

  /* ---------- aplicar formato à seleção ---------- */
  fmtTargets() {
    const sel = Ed.selected(); return sel.length ? sel : [];
  },
  applyFormat(fn) {
    const t = UI.fmtTargets(); if (!t.length) return;
    Ed.do(() => { for (const o of t) fn(o.n, o); });
  },

  /* ---------- ribbon ---------- */
  buildRibbon() {
    const tabs = $('#ribbonTabs'), body = $('#ribbon');
    tabs.innerHTML = `<button class="file-btn" id="fileBtn">Arquivo</button>` + RIBBON.map(t => `<button class="rtab" data-tab="${t.id}">${t.label}</button>`).join('');
    body.innerHTML = RIBBON.map(t => `<div class="rpanel" data-panel="${t.id}" hidden>${t.groups.map(g => UI.groupHTML(g)).join('')}</div>`).join('');
    tabs.addEventListener('click', e => {
      const b = e.target.closest('.rtab'); if (b) UI.showTab(b.dataset.tab);
      if (e.target.closest('#fileBtn')) Backstage.open();
    });
    body.addEventListener('click', e => UI.ribbonClick(e));
    body.addEventListener('change', e => UI.ribbonChange(e));
    UI.showTab(localStorage.getItem('unimap.tab') || 'home');
    body.addEventListener('mousedown', e => { if (e.target.closest('button') && !e.target.closest('select,input')) e.preventDefault(); });
  },
  showTab(id) {
    $$('.rtab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
    $$('.rpanel').forEach(p => p.hidden = p.dataset.panel !== id);
    try { localStorage.setItem('unimap.tab', id); } catch (_) {}
  },
  groupHTML(g) {
    const item = it => {
      if (it.col) return `<div class="rcol">${it.col.map(item).join('')}</div>`;
      if (it.row) return `<div class="rrow">${it.row.map(item).join('')}</div>`;
      if (it.ctl) return UI.ctlHTML(it);
      const c = CMD[it.cmd]; if (!c) return '';
      const cls = it.big ? 'rb big' : 'rb small';
      const label = it.label || c.label;
      return `<button class="${cls}" data-cmd="${it.cmd}" title="${U.esc(label + (c.keyLabel ? ' (' + c.keyLabel + ')' : ''))}">${ico(it.icon || c.icon, it.big ? 28 : 18)}${it.noLabel ? '' : `<span>${U.esc(label)}</span>`}</button>`;
    };
    return `<div class="rgroup"><div class="rg-items">${g.items.map(item).join('')}</div><div class="rg-title">${g.title}</div></div>`;
  },
  ctlHTML(it) {
    switch (it.ctl) {
      case 'font': return `<select class="rsel font" data-ctl="font" title="Fonte">${UI.fonts.map(f => `<option>${f}</option>`).join('')}</select>`;
      case 'size': return `<select class="rsel size" data-ctl="size" title="Tamanho da fonte">${UI.fontSizes.map(s => `<option>${s}</option>`).join('')}</select>`;
      case 'fmt': return ['bold', 'italic', 'underline', 'strike'].map(k => `<button class="rb small ico-only" data-fmt="${k}" title="${{ bold: 'Negrito', italic: 'Itálico', underline: 'Sublinhado', strike: 'Tachado' }[k]}">${ico(k, 16)}</button>`).join('');
      case 'align': return ['Near', 'Center', 'Far'].map(k => `<button class="rb small ico-only" data-align="${k}" title="Alinhar texto">${ico({ Near: 'alignL', Center: 'alignC', Far: 'alignR' }[k], 16)}</button>`).join('');
      case 'color': return `<button class="rb big colorbtn" data-color="${it.kind}" title="${it.title}"><span class="cb-i">${ico(it.icon, 26)}<i class="cb-bar" id="cb-${it.kind}"></i></span><span>${it.title}</span></button>`;
      case 'colorsm': return `<button class="rb small colorbtn" data-color="${it.kind}" title="${it.title}"><span class="cb-i">${ico(it.icon, 16)}<i class="cb-bar" id="cb-${it.kind}"></i></span><span>${it.title}</span></button>`;
      case 'zoomsel': return `<select class="rsel size" data-ctl="zoom" title="Zoom">${[10, 25, 50, 75, 100, 125, 150, 200, 300, 400].map(z => `<option value="${z}">${z}%</option>`).join('')}</select>`;
      case 'gridsize': return `<label class="rlab">Grade <select class="rsel size" data-ctl="gridsize">${[5, 10, 20, 25, 50].map(z => `<option>${z}</option>`).join('')}</select></label>`;
    }
    return '';
  },
  ribbonClick(e) {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.cmd) { UI.run(b.dataset.cmd); return; }
    if (b.dataset.fmt) { const k = b.dataset.fmt; const on = !b.classList.contains('on'); UI.applyFormat(n => Sc.setFmt(n, { [k]: on })); return; }
    if (b.dataset.align) { UI.applyFormat(n => Sc.setFmt(n, { align: b.dataset.align })); return; }
    if (b.dataset.color) { UI.colorPicker(b, b.dataset.color); return; }
  },
  ribbonChange(e) {
    const s = e.target; if (!s.dataset.ctl) return;
    if (s.dataset.ctl === 'font') UI.applyFormat(n => Sc.setFmt(n, { font: s.value }));
    else if (s.dataset.ctl === 'size') UI.applyFormat(n => Sc.setFmt(n, { size: +s.value }));
    else if (s.dataset.ctl === 'zoom') View.setZoom(+s.value / 100);
    else if (s.dataset.ctl === 'gridsize') { Ed.gridSize = +s.value; View.schedule(); }
  },
  colorPicker(anchor, kind) {
    const r = anchor.getBoundingClientRect();
    const title = { fill: 'Cor de preenchimento', border: 'Cor da borda', font: 'Cor da fonte' }[kind];
    const cur = UI.curColors[kind];
    const sw = UI.swatches.map(c => `<button class="sw" data-c="${c}" style="background:${c}" title="${c}"></button>`).join('');
    const rec = UI.recent.length ? `<div class="sw-t">Recentes</div><div class="sw-g">${UI.recent.map(c => `<button class="sw" data-c="${c}" style="background:${c}" title="${c}"></button>`).join('')}</div>` : '';
    const m = h(`<div class="menu colormenu"><div class="sw-t">${title}</div><div class="sw-g">${sw}</div>${rec}${kind === 'fill' ? '<button class="mi-btn" data-c="none">Sem preenchimento</button>' : ''}<button class="mi-btn" data-c="default">Padrão do tipo de elemento</button><label class="mi-btn custom">Personalizada… <input type="color" value="${cur && cur[0] === '#' ? cur : '#1f7ae0'}"></label></div>`);
    UI.closeMenus(); document.body.appendChild(m);
    m.style.left = Math.min(r.left, innerWidth - 250) + 'px'; m.style.top = r.bottom + 2 + 'px';
    const apply = c => {
      UI.closeMenus();
      if (c !== 'none' && c !== 'default') { UI.recent = [c, ...UI.recent.filter(x => x !== c)].slice(0, 8); try { localStorage.setItem('unimap.recentColors', JSON.stringify(UI.recent)); } catch (_) {} }
      UI.setColor(kind, c);
    };
    m.addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (b) apply(b.dataset.c); });
    $('input[type=color]', m).addEventListener('change', e => apply(e.target.value));
    setTimeout(() => { const off = ev => { if (!ev.target.closest('.menu')) { UI.closeMenus(); document.removeEventListener('pointerdown', off, true); } }; document.addEventListener('pointerdown', off, true); }, 0);
  },
  curColors: { fill: '#ECEFFF', border: '#03689A', font: '#000000' },
  setColor(kind, c) {
    const val = c === 'none' ? 0 : c === 'default' ? null : U.fromCss(c);
    UI.applyFormat((n, o) => {
      if (kind === 'font') { Sc.setFmt(n, { color: val === null ? -16777216 : val }); return; }
      let v = val;
      if (v === null) { const k = o.kind; const pal = (k === 'subprocess' || k === 'task') ? PALETTE.task : PALETTE[k] || PALETTE.task; v = kind === 'fill' ? pal.fill : pal.border; if (o.kind === 'flow' || o.kind === 'assoc' || o.kind === 'msg') v = -16777216; }
      Sc.setColors(n, { [kind]: v });
    });
  },

  /* ---------- abas de diagramas ---------- */
  buildTabs() {
    const bar = $('#tabs'); const m = Ed.model; if (!m) return;
    this.openTabs = this.openTabs.filter(d => m.diagrams.includes(d));
    if (Ed.d && !this.openTabs.includes(Ed.d)) this.openTabs.push(Ed.d);
    bar.innerHTML = this.openTabs.map(d => `<div class="tab ${d === Ed.d ? 'active' : ''}" data-id="${d.id}" title="${U.esc(d.doc.root.a.Name)}"><span class="tn">${U.esc(d.doc.root.a.Name)}</span>${d.dirty ? '<i class="dot"></i>' : ''}<button class="tc" aria-label="Fechar aba">${ico('close', 12)}</button></div>`).join('') + `<button class="tab-add" title="Novo diagrama">${ico('plus', 16)}</button>`;
  },
  tabsInit() {
    const bar = $('#tabs');
    bar.addEventListener('click', e => {
      if (e.target.closest('.tab-add')) { UI.run('addDiagram'); return; }
      const t = e.target.closest('.tab'); if (!t) return;
      const d = Ed.model.diagrams.find(x => x.id === t.dataset.id); if (!d) return;
      if (e.target.closest('.tc')) {
        if (this.openTabs.length <= 1) return;
        const i = this.openTabs.indexOf(d); this.openTabs.splice(i, 1);
        if (Ed.d === d) UI.switchTo(this.openTabs[Math.max(0, i - 1)]); else this.buildTabs();
        return;
      }
      UI.switchTo(d);
    });
    bar.addEventListener('dblclick', e => { const t = e.target.closest('.tab'); if (t) UI.run('renameDiagram'); });
    bar.addEventListener('auxclick', e => { if (e.button === 1) { const t = e.target.closest('.tab'); if (t) { const d = Ed.model.diagrams.find(x => x.id === t.dataset.id); if (this.openTabs.length > 1) { this.openTabs.splice(this.openTabs.indexOf(d), 1); if (Ed.d === d) UI.switchTo(this.openTabs[0]); else this.buildTabs(); } } } });
    bar.addEventListener('contextmenu', e => {
      const t = e.target.closest('.tab'); if (!t) return; e.preventDefault();
      const d = Ed.model.diagrams.find(x => x.id === t.dataset.id); if (d !== Ed.d) UI.switchTo(d);
      UI.menu(e.clientX, e.clientY, [{ label: 'Renomear…', icon: 'rename', run: () => UI.run('renameDiagram') }, { label: 'Duplicar', icon: 'dup', run: () => UI.run('dupDiagram') }, { label: 'Excluir', icon: 'delete', run: () => UI.run('deleteDiagram') }]);
    });
  },
  switchTo(d) { View.saveScroll(); Ed.openDiagram(d); },

  /* ---------- atualiza estados da interface ---------- */
  refresh() {
    $$('.rb[data-cmd]').forEach(b => { const c = CMD[b.dataset.cmd]; const en = !c.enabled || c.enabled(); b.disabled = !en; if (c.toggled) b.classList.toggle('on', !!c.toggled()); });
    const sel = Ed.selected();
    const first = sel[0];
    if (first) {
      const f = Sc.fmt(first.n); const c = Sc.colors(first.n);
      const fs = $('[data-ctl=font]'); if (fs && document.activeElement !== fs) fs.value = UI.fonts.includes(f.font) ? f.font : (fs.add(new Option(f.font, f.font)), f.font);
      const ss = $('[data-ctl=size]'); if (ss && document.activeElement !== ss) { if (![...ss.options].some(o => +o.value === f.size)) ss.add(new Option(f.size, f.size)); ss.value = f.size; }
      $$('[data-fmt]').forEach(b => b.classList.toggle('on', !!f[{ bold: 'bold', italic: 'italic', underline: 'underline', strike: 'strike' }[b.dataset.fmt]]));

const Panels = {
  collapsed: new Set(),
  init() {
    const left = $('#left');
    $('#leftTabs').addEventListener('click', e => { const b = e.target.closest('[data-lt]'); if (b) this.showLeft(b.dataset.lt); });
    this.palette(); this.explorer();
    $('#palBody').addEventListener('click', e => this.palClick(e));
    $('#palBody').addEventListener('dblclick', e => this.palDbl(e));
    $('#palBody').addEventListener('dragstart', e => {
      const it = e.target.closest('.pal-item'); if (!it) return;
      const t = this.toolOf(it.dataset.key); if (!t || t.type === 'conn') { e.preventDefault(); return; }
      e.dataTransfer.setData('application/x-unimap', JSON.stringify(t)); e.dataTransfer.effectAllowed = 'copy';
    });
    $('#palSearch').addEventListener('input', () => this.filterPalette());
    $('#exBody').addEventListener('click', e => this.exClick(e));
    $('#exBody').addEventListener('dblclick', e => this.exDbl(e));
    $('#exBody').addEventListener('contextmenu', e => this.exCtx(e));
    $('#exSearch').addEventListener('input', () => this.explorer());
    $('#propsBody').addEventListener('change', e => Props.onChange(e));
    $('#propsBody').addEventListener('click', e => Props.onClick(e));
    Ed.on('selection', () => { Props.render(); });
    Ed.on('change', () => { if (!Props.busy()) Props.render(); this.explorerSoon(); });
    Ed.on('diagram', () => { Props.render(); this.explorer(); });
    Ed.on('model', () => { this.palette(); this.explorer(); });
  },
  showLeft(id) {
    $$('#leftTabs [data-lt]').forEach(b => b.classList.toggle('active', b.dataset.lt === id));
    $('#palPane').hidden = id !== 'pal'; $('#exPane').hidden = id !== 'ex';
  },
  toggle(sel) { const el = $(sel); el.hidden = !el.hidden; View.schedule(); UI.refresh(); },
  focusSearch() { this.toggleLeftVisible(true); this.showLeft('ex'); $('#exSearch').focus(); },
  toggleLeftVisible(v) { $('#left').hidden = !v; },

  /* ----- paleta ----- */
  preview(it) {
    if (it.icon) return ico(it.icon, 26);
    if (it.custom) return `<img src="${it.custom}" alt="">`;
    const k = it.kind; const def = Sc.SIZE[k] || [155, 60];
    const a = Sc.makeActivity(k, Object.assign({}, it.opts, { x: 3, y: 3, name: '' }));
    const gv = Render.drawActivityRaw({ n: a, kind: k });
    const W = def[0] + 6, H = def[1] + 6;
    const box = k === 'task' || k === 'subprocess' ? [44, k === 'task' ? 26 : 32] : [28, 28];
    return `<svg width="${box[0] + 4}" height="${box[1] + 4}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${gv}</svg>`;
  },
  palette() {
    const body = $('#palBody'); const parts = [];
    const sections = PAL.slice();
    // personalizados
    const customs = (Ed.model ? Ed.model.artifactTypes : []).map(a => ({ key: 'x:' + a.id, label: a.name || 'Imagem', kind: 'custom', typeId: a.id, custom: 'data:image/png;base64,' + a.image, name: a.name }));
    for (const s of sections) {
      const open = !this.collapsed.has(s.id);
      parts.push(`<section class="pal-sec ${open ? '' : 'closed'}" data-sec="${s.id}"><h4 class="pal-h" data-sec-h="${s.id}">${ico('chevron', 14)}<span>${s.title}</span></h4><div class="pal-b">`);
      for (const g of s.groups) {
        if (g.sub) parts.push(`<div class="pal-sub">${g.sub}</div>`);
        parts.push('<div class="pal-grid">');
        for (const it of g.items) parts.push(`<button class="pal-item" draggable="${it.conn ? 'false' : 'true'}" data-key="${U.esc(it.key)}" title="${U.esc(it.label)}" aria-label="${U.esc(it.label)}">${this.preview(it)}</button>`);
        parts.push('</div>');
      }
      parts.push('</div></section>');
    }
    const open = !this.collapsed.has('custom');
    parts.push(`<section class="pal-sec ${open ? '' : 'closed'}" data-sec="custom"><h4 class="pal-h" data-sec-h="custom">${ico('chevron', 14)}<span>Imagens (artefatos)</span></h4><div class="pal-b"><div class="pal-grid">`);
    for (const it of customs) parts.push(`<button class="pal-item" draggable="true" data-key="${U.esc(it.key)}" title="${U.esc(it.label)}">${this.preview(it)}<em>${U.esc(it.label)}</em></button>`);
    parts.push(`<button class="pal-item add" data-key="x:add" title="Importar imagem">${ico('plus', 20)}</button></div></div></section>`);
    body.innerHTML = parts.join('');
    this._items = new Map(); for (const s of sections) for (const g of s.groups) for (const it of g.items) this._items.set(it.key, it); for (const c of customs) this._items.set(c.key, c);
  },
  filterPalette() {
    const q = $('#palSearch').value.trim().toLowerCase();
    $$('.pal-item', $('#palBody')).forEach(b => { const it = this._items.get(b.dataset.key); const show = !q || (it && it.label.toLowerCase().includes(q)) || b.dataset.key === 'x:add'; b.hidden = !show; });
    $$('.pal-sec', $('#palBody')).forEach(s => { const any = $$('.pal-item:not([hidden])', s).length > 0; s.hidden = !any; if (q && any) s.classList.remove('closed'); });
  },
  toolOf(key) {
    const it = this._items.get(key); if (!it) return null;

  /* ----- importar imagem como artefato personalizado ----- */
  importArtifact() {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/png,image/jpeg,image/svg+xml,image/gif,image/webp';
    inp.onchange = async () => {
      const f = inp.files[0]; if (!f) return;
      const name = await UI.prompt('Nova imagem de artefato', 'Nome', f.name.replace(/\.[^.]+$/, '').toUpperCase());
      if (name === null) return;
      // normaliza para PNG 128x128 (como o modelo original)
      const url = URL.createObjectURL(f);
      const img = new Image(); img.onload = () => {
        const c = document.createElement('canvas'); const s = 128; c.width = s; c.height = s; const g = c.getContext('2d');
        const r = Math.min(s / img.width, s / img.height); g.drawImage(img, (s - img.width * r) / 2, (s - img.height * r) / 2, img.width * r, img.height * r);
        const b64 = c.toDataURL('image/png').split(',')[1]; URL.revokeObjectURL(url);
        const id = U.uuid();
        const doc = X.parse(`<?xml version="1.0"?>\n<CustomArtifactType xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" Id="${id}" Name="${U.esc(name)}">\n  <Image>${b64}</Image>\n</CustomArtifactType>`);
        Ed.model.artifactTypes.push({ id, name, image: b64, doc, entry: 'BizAgiArtifacts/' + id + '.xml' });
        Ed.dirty = true; this.palette(); this.explorer(); UI.refresh(); UI.toast('Imagem adicionada à paleta.');
      };
      img.onerror = () => UI.alert('Imagem', 'Não foi possível ler a imagem.'); img.src = url;
    };
    inp.click();
  },

  /* ----- explorador ----- */

  explorer() {

      <div class="pgrid">${this.chk('Negrito', 'f.bold', f.bold)}${this.chk('Itálico', 'f.italic', f.italic)}${this.chk('Sublinhado', 'f.underline', f.underline)}${this.chk('Tachado', 'f.strike', f.strike)}</div>
      <div class="pgrid">${this.color('Cor do texto', 'f.color', f.color)}${this.sel('Alinhar', 'f.align', [['Near', 'Esquerda'], ['Center', 'Centro'], ['Far', 'Direita']], f.align)}</div>`;

  singleHTML(o) {

        gen += this.sel('Repetição', 'loop', [['None', 'Nenhuma'], ['Standard', 'Laço (loop)'], ['MultiInstance:Parallel', 'Múltiplas instâncias (paralelo)'], ['MultiInstance:Sequential', 'Múltiplas instâncias (sequencial)']], lt === 'MultiInstance' ? 'MultiInstance:' + (lm || 'Parallel') : lt);

      if (o.kind === 'end') gen += this.sel('Resultado', 'trigger', END_RESULTS, Sc.trigger(n));
      s += this.sec('Geral', gen);

      if (lane) s += this.sec('Localização', `<dl class="info"><dt>Pool</dt><dd>${U.esc(lane.pool.n.a.Name || '')}</dd><dt>Raia</dt><dd>${U.esc(lane.lane ? lane.lane.n.a.Name : '—')}</dd></dl>`, false);

  lanesList(po) { const ls = X.qa(X.q(po.n, 'Lanes'), 'Lane'); if (!ls.length) return ''; return `<div class="lanes-l">${ls.map(l => `<button class="lane-b" data-a="sel" data-id="${l.a.Id}">${ico('lane', 13)}${U.esc(l.a.Name)}</button>`).join('')}</div>`; },

  onChange(e) {
    const el = e.target; const p = el.dataset.p; if (!p) return;

    if (p.startsWith('d.')) {
      const r = Ed.d.doc.root; const ph = X.q(r, 'PackageHeader'), rh = X.q(r, 'RedefinableHeader');
      Ed.do(() => {
        if (p === 'd.name') { r.a.Name = String(v).trim() || r.a.Name; const dsc = X.q(ph, 'Description'); if (dsc) dsc.x = r.a.Name; }
        else if (p === 'd.author') X.q(rh, 'Author').x = v || null;
        else if (p === 'd.ver') X.q(rh, 'Version').x = v || null;
        else if (p === 'd.desc') X.q(ph, 'Description').x = v || null;
        else if (p === 'd.doc') X.q(ph, 'Documentation').x = v || null;

    if (!o) return;

      const r = { ...g }; r[p.slice(2)] = val;
      if (o.kind === 'lane') { const lg = Sc.gfx(n); Ed.do(() => { const d = val - X.num(lg.a.Height); lg.a.Height = String(Math.max(40, val)); const pg = Sc.gfx(o.pool.n); pg.a.Height = String(X.num(pg.a.Height) + d); Ed.relayoutLanes(o.pool.n); }); return; }
      Ed.do(() => { if (o.kind === 'pool') { const pg = Sc.gfx(n); pg.a.Width = String(Math.max(300, r.w)); pg.a.Height = String(Math.max(60, r.h)); const c = X.q(pg, 'Coordinates'); c.a.XCoordinate = String(r.x); c.a.YCoordinate = String(r.y); Ed.relayoutLanes(n); } else { if (o.kind === 'start' || o.kind === 'inter' || o.kind === 'end' || o.kind === 'gateway') { if (p === 'g.w') r.h = r.w; if (p === 'g.h') r.w = r.h; } Sc.setRect(n, r); Ed.rerouteFor([o.id]); } });
    };
    if (p.startsWith('g.')) { geom(); return; }
    Ed.do(() => {
      switch (p) {
        case 'name': Ed.rename(o, v); break;
        case 'desc': { let d = X.q(n, 'Description'); if (!d) { d = E('Description'); n.c.unshift(d); } X.setText(d, v); if (o.act && X.q(n, 'Documentation') && !X.text(n, 'Documentation')) X.setText(X.q(n, 'Documentation'), v); break; }
        case 'doc': { let d = X.q(n, 'Documentation'); if (!d) { d = E('Documentation'); const at = n.c.findIndex(c => c.t === 'NodeGraphicsInfos'); n.c.splice(at < 0 ? n.c.length : at, 0, d); } X.setText(d, v); break; }
        case 'ldoc': { const d = X.q(n, 'Documentation'); if (d) X.setText(d, v); break; }
        case 'taskType': Ed.setTaskType(n, v); break;
        case 'gwType': Ed.setGatewayType(n, v); break;
        case 'trigger': Ed.setTrigger(n, v); break;
        case 'throw': Ed.setIntermediateKind(n, v === 'throw'); break;
        case 'loop': { if (v.startsWith('MultiInstance')) { Ed.setLoop(n, 'MultiInstance'); X.q(n, 'Loop').a.MI_Ordering = v.split(':')[1]; } else Ed.setLoop(n, v); break; }
        case 'comp': { const t = X.q(n, 'Implementation/Task'); if (t) { if (v) t.a.IsForCompensation = 'true'; else delete t.a.IsForCompensation; } break; }
        case 'cond': Ed.setCondition(n, v || null, ''); break;
        case 'expr': { const c = X.q(n, 'Condition'); let ex = X.q(c, 'Expression'); if (!ex) { ex = E('Expression'); c.c.push(ex); } X.setText(ex, v); break; }
        case 'adir': if (v === 'None') delete n.a.AssociationDirection; else n.a.AssociationDirection = v; break;
        case 'c.fill': Sc.setColors(n, { fill: U.fromCss(v) }); break;
        case 'c.border': Sc.setColors(n, { border: U.fromCss(v) }); break;
        case 'f.font': Sc.setFmt(n, { font: v }); break;
        case 'f.size': Sc.setFmt(n, { size: +v }); break;
        case 'f.bold': Sc.setFmt(n, { bold: v }); break;
        case 'f.italic': Sc.setFmt(n, { italic: v }); break;
        case 'f.underline': Sc.setFmt(n, { underline: v }); break;
        case 'f.strike': Sc.setFmt(n, { strike: v }); break;
        case 'f.color': Sc.setFmt(n, { color: U.fromCss(v) }); break;
        case 'f.align': Sc.setFmt(n, { align: v }); break;
        default:
          if (p.startsWith('perf:')) {
            const pid = p.slice(5); let pf = X.q(n, 'Performers'); if (!pf) { pf = E('Performers'); const at = n.c.findIndex(c => c.t === 'Documentation'); n.c.splice(at < 0 ? n.c.length : at, 0, pf); }
            pf.c = pf.c.filter(c => c.x !== pid); if (v) pf.c.push(E('Performer', {}, pid));
          }
      }
    });
    Props.render();
  },
};

/* ---------- participantes ---------- */
const Participants = {
  open() {
    const m = Ed.model; const root = m.participants.root;
    const work = X.qa(root, 'Participant').map(p => ({ id: p.a.Id, name: p.a.Name, type: X.q(p, 'ParticipantType').a.Type, desc: X.text(p, 'Description'), node: p }));
    const body = h('<div><p class="hint">Participantes são os papéis, pessoas ou sistemas do modelo. Eles ficam disponíveis como executores das atividades e como nomes de raias.</p><table class="ptable"><thead><tr><th>Nome</th><th>Tipo</th><th></th></tr></thead><tbody></tbody></table><button class="btn sm" id="pAdd">+ Adicionar participante</button></div>');

    const draw = () => {
      tb.innerHTML = work.map((p, i) => `<tr data-i="${i}"><td><input type="text" value="${U.esc(p.name)}" data-k="name"></td><td><select data-k="type">${Object.entries(PART_TYPES).map(([v, l]) => `<option value="${v}" ${p.type === v ? 'selected' : ''}>${l}</option>`).join('')}</select></td><td><button class="icon-btn" data-del="${i}" title="Remover">${ico('delete', 16)}</button></td></tr>`).join('');
    };

    tb.addEventListener('input', e => { const tr = e.target.closest('tr'); if (!tr) return; work[+tr.dataset.i][e.target.dataset.k] = e.target.value; });
    tb.addEventListener('change', e => { const tr = e.target.closest('tr'); if (!tr) return; work[+tr.dataset.i][e.target.dataset.k] = e.target.value; });

    $('#pAdd', body).onclick = () => { work.push({ id: U.uuid(), name: 'Novo participante', type: 'ROLE', desc: '', node: null }); draw(); const ins = $$('input', tb); ins[ins.length - 1].focus(); ins[ins.length - 1].select(); };
    UI.dialog({ title: 'Participantes do modelo', body, width: 560, buttons: [{ label: 'Cancelar', value: null }, { label: 'Salvar', primary: true, click: (b, done) => done(work) }] }).then(res => {
      if (!res) return;
      Ed.checkpoint();
      root.c = res.filter(p => p.name.trim()).map(p => {
        const slug = p.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]/g, '');
        if (p.node) { p.node.a.Name = p.name.trim(); X.q(p.node, 'ParticipantType').a.Type = p.type; const ea = X.q(p.node, 'ExtendedAttributes'); if (ea && ea.c[0]) ea.c[0].a.Name = slug; return p.node; }
        return E('Participant', { Id: p.id, Name: p.name.trim() }, [E('ParticipantType', { Type: p.type }), E('Description'), E('ExtendedAttributes', {}, [E('ExtendedAttribute', { Name: slug })])]);
      });
      Model.syncAllParticipants(Ed.model);
